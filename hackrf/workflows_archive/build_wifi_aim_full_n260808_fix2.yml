name: Build Full WiFi AIM n_260808 fix2

on:
  push:
    paths:
      - '.github/workflows/build_wifi_aim_full_n260808_fix2.yml'
      - 'wifi_aim_n260808/src.part*'
      - 'trigger_wifi_aim_fix2.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct WiFi AIM sources
        shell: bash
        run: |
          set -euo pipefail
          cat wifi_aim_n260808/src.part* > /tmp/wifi_aim_src.b64
          base64 -d /tmp/wifi_aim_src.b64 > /tmp/wifi_aim_src.tar.gz
          echo '294072ffe25e369fee1276cca11ea6a374fc27b2e09a081eb444eabd8eb01cb9  /tmp/wifi_aim_src.tar.gz' | sha256sum -c -
          mkdir -p wifi_src
          tar -xzf /tmp/wifi_aim_src.tar.gz -C wifi_src
          test -f wifi_src/firmware/application/external/wifi_aim/main.cpp
          test -f wifi_src/firmware/common/wifi_aim/wifi_aim_phy.cpp

      - name: Checkout Mayhem snapshot for n_260808
        run: |
          git clone --recursive https://github.com/portapack-mayhem/mayhem-firmware.git mayhem
          cd mayhem
          git checkout 367eaf54c0f51f62448d9f2d9585fd3629f6b770
          git submodule update --init --recursive

      - name: Integrate full WiFi AIM with end-of-section alignment
        shell: bash
        run: |
          set -euo pipefail
          cp -a wifi_src/firmware/application/external/wifi_aim mayhem/firmware/application/external/
          cp wifi_src/firmware/baseband/proc_wifi_aim.* mayhem/firmware/baseband/
          cp wifi_src/firmware/common/wifi_aim_wire.hpp mayhem/firmware/common/
          cp -a wifi_src/firmware/common/wifi_aim mayhem/firmware/common/

          python3 - <<'PY'
          from pathlib import Path

          p = Path('mayhem/firmware/application/external/external.cmake')
          s = p.read_text()
          src_anchor = '  external/signal_hunter/ui_signal_hunter.cpp'
          src_add = src_anchor + '\n\n  #wifi_aim\n  external/wifi_aim/main.cpp\n  external/wifi_aim/ui_wifi_aim.cpp'
          if 'external/wifi_aim/main.cpp' not in s:
              assert src_anchor in s
              s = s.replace(src_anchor, src_add, 1)
          list_anchor = '  signal_hunter\n'
          if '\twifi_aim\n' not in s and '  wifi_aim\n' not in s:
              assert list_anchor in s
              s = s.replace(list_anchor, list_anchor + '\twifi_aim\n', 1)
          p.write_text(s)

          p = Path('mayhem/firmware/application/external/external.ld')
          s = p.read_text()
          mem_anchor = '    ram_external_app_tetra_rx              (rwx) : org = 0xAE0C0000, len = 32k'
          if 'ram_external_app_wifi_aim' not in s:
              assert mem_anchor in s
              s = s.replace(mem_anchor, mem_anchor + '\n    ram_external_app_wifi_aim              (rwx) : org = 0xAE0D0000, len = 32k', 1)
          sec_anchor = '} > ram_external_app_signal_hunter'
          if '.external_app_wifi_aim' not in s:
              assert sec_anchor in s
              block = '''\n\n    .external_app_wifi_aim : ALIGN(4) SUBALIGN(4)\n    {\n        KEEP(*(.external_app.app_wifi_aim.application_information));\n        */external/wifi_aim/*(*ui*external_app*wifi_aim*);\n        /* Critical: exporter appends M4 immediately after this output section.\n         * Align the END so m4_app_offset and the copied M0 length are word aligned. */\n        . = ALIGN(4);\n    } > ram_external_app_wifi_aim'''
              s = s.replace(sec_anchor, sec_anchor + block, 1)
          p.write_text(s)

          p = Path('mayhem/firmware/tools/external_app_info.py')
          s = p.read_text().replace('external_apps_address_end = 0xAE0B0000', 'external_apps_address_end = 0xAE0E0000')
          p.write_text(s)

          p = Path('mayhem/firmware/baseband/CMakeLists.txt')
          s = p.read_text()
          anchor = 'DeclareTargets(HUNT signal_hunter)'
          if 'DeclareTargets(WAIM wifi_aim)' not in s:
              assert anchor in s
              block = '''\n\n### WiFi AIM\nset(MODE_FLAGS "-Os")\nset(MODE_CPPSRC\n    proc_wifi_aim.cpp\n    ${COMMON}/wifi_aim/wifi_aim_phy.cpp\n)\nDeclareTargets(WAIM wifi_aim)\nset(MODE_FLAGS "-O3")'''
              s = s.replace(anchor, anchor + block, 1)
          p.write_text(s)
          PY

          grep -A10 -n '.external_app_wifi_aim' mayhem/firmware/application/external/external.ld

      - name: Build official Mayhem toolchain image
        run: |
          cd mayhem
          docker build -t portapack-dev -f dockerfile-nogit .

      - name: Full build n_260808
        shell: bash
        run: |
          set +e
          OUT="$PWD/build_results/wifi_aim_full_n260808_fix2"
          rm -rf "$OUT"
          mkdir -p "$OUT" mayhem/build
          cd mayhem
          docker run -e VERSION_STRING=n_260808 -i -v "$PWD":/havoc portapack-dev 2>&1 | tee "$OUT/BUILD_FULL.log"
          rc=${PIPESTATUS[0]}
          echo "$rc" > "$OUT/BUILD_RC.txt"
          exit 0

      - name: Collect, verify loader invariants and publish
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          OUT=build_results/wifi_aim_full_n260808_fix2
          mkdir -p "$OUT"
          rc=$(cat "$OUT/BUILD_RC.txt" 2>/dev/null || echo 999)
          echo "build_rc=$rc" > "$OUT/VERIFY.txt"
          PPMA=mayhem/build/firmware/application/wifi_aim.ppma
          M4=mayhem/build/firmware/baseband/WAIM.bin
          if [ ! -f "$PPMA" ]; then
            echo 'RESULT=NO_PPMA' >> "$OUT/VERIFY.txt"
          else
            cp "$PPMA" "$OUT/WiFiAIM_n260808_fix2.ppma"
            [ -f "$M4" ] && cp "$M4" "$OUT/WAIM.bin"
            python3 - <<'PY' >> "$OUT/VERIFY.txt"
          import struct, hashlib
          from pathlib import Path
          p=Path('build_results/wifi_aim_full_n260808_fix2/WiFiAIM_n260808_fix2.ppma')
          b=p.read_bytes()
          mem,entry,header,appver=struct.unpack_from('<IIII', b, 0)
          # Exact n_260808 application_information_t layout / export_external_apps.py constants.
          tag=b[76:80]
          m4off=struct.unpack_from('<I',b,80)[0]
          def checksum32(data):
              if len(data)%4: data += b'\0'*(4-len(data)%4)
              return sum(struct.unpack('<%dI'%(len(data)//4),data)) & 0xffffffff
          # Simulate Mayhem run_external_app() reads and simple_checksum() calls.
          total=0
          file_read_index=0
          while file_read_index < m4off:
              n=512
              if file_read_index + 512 > m4off:
                  n=m4off-file_read_index
              if n==0: break
              chunk=b[file_read_index:file_read_index+n]
              total=(total+checksum32(chunk))&0xffffffff
              if len(chunk)<512: break
              file_read_index += 512
          file_read_index=m4off
          while True:
              n=512
              if file_read_index%512:
                  n=512-(file_read_index%512)
              if n==0: break
              chunk=b[file_read_index:file_read_index+n]
              if not chunk: break
              total=(total+checksum32(chunk))&0xffffffff
              if len(chunk)!=n: break
              file_read_index += len(chunk)
          print(f'file_size={len(b)}')
          print(f'memory_location=0x{mem:08X}')
          print(f'entry=0x{entry:08X} entry_delta={entry-mem}')
          print(f'header={header} app_version=0x{appver:08X}')
          print(f'tag={tag!r}')
          print(f'm4_offset={m4off} mod4={m4off%4}')
          print(f'm4_payload_plus_checksum={len(b)-m4off}')
          print(f'loader_checksum=0x{total:08X}')
          print(f'sha256={hashlib.sha256(b).hexdigest()}')
          ok=(m4off%4==0 and total==0 and header==3 and tag==b'WAIM' and (entry&1)==1)
          print('RESULT=' + ('PASS' if ok else 'FAIL'))
          if not ok: raise SystemExit(2)
          PY
            sha256sum "$OUT/WiFiAIM_n260808_fix2.ppma" > "$OUT/SHA256SUMS.txt"
            base64 -w0 "$OUT/WiFiAIM_n260808_fix2.ppma" > "$OUT/WiFiAIM_n260808_fix2.ppma.b64"
          fi
          tail -n 700 "$OUT/BUILD_FULL.log" > "$OUT/BUILD_TAIL.txt" 2>/dev/null || true

          git config user.name 'wifi-aim-builder'
          git config user.email 'actions@users.noreply.github.com'
          git add -f "$OUT"
          git commit -m 'Publish WiFi AIM n_260808 fix2 build result' || true
          git pull --rebase origin main || true
          git push origin HEAD:main || true

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wifi-aim-full-n260808-fix2
          path: build_results/wifi_aim_full_n260808_fix2/*
          if-no-files-found: warn
