name: Build WiFi AIM V0.4 Diagnostic

on:
  push:
    paths:
      - '.github/workflows/build_wifi_aim_probe.yml'
      - 'wifi_aim_buildsrc_min.zip.b64'
      - 'trigger_wifi_aim_full.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout build workspace
        uses: actions/checkout@v4

      - name: Build and collect diagnostics
        shell: bash
        run: |
          set +e
          OUT="$PWD/build_results/wifi_aim_v04_diag"
          LOG="$OUT/BUILD_FULL.log"
          rm -rf "$OUT" wifi_src mayhem /tmp/wifi_aim_buildsrc_min.zip
          mkdir -p "$OUT" wifi_src
          : > "$LOG"
          echo "started=$(date -u +%FT%TZ)" > "$OUT/BUILD_STATUS.txt"
          echo "source_commit=${GITHUB_SHA}" >> "$OUT/BUILD_STATUS.txt"

          phase() { echo "" | tee -a "$LOG"; echo "===== $1 =====" | tee -a "$LOG"; }
          record() { echo "$1=$2" | tee -a "$OUT/BUILD_STATUS.txt"; }

          phase UNPACK
          base64 -d wifi_aim_buildsrc_min.zip.b64 > /tmp/wifi_aim_buildsrc_min.zip 2>>"$LOG"
          decode_rc=$?
          record source_b64_decode_rc "$decode_rc"
          if [ "$decode_rc" -eq 0 ]; then
            actual_sha=$(sha256sum /tmp/wifi_aim_buildsrc_min.zip | awk '{print $1}')
            record source_zip_sha256 "$actual_sha"
            expected_sha="4fa52d992f08c5ceacfafb916b132f56343ab3fa2512c828051a5cd8f671310b"
            if [ "$actual_sha" != "$expected_sha" ]; then
              echo "Source ZIP SHA mismatch: expected $expected_sha got $actual_sha" >>"$LOG"
              rc=91
            else
              unzip -q /tmp/wifi_aim_buildsrc_min.zip -d wifi_src >>"$LOG" 2>&1
              rc=$?
            fi
          else
            rc="$decode_rc"
          fi
          record unpack_rc "$rc"
          SRC="$PWD/wifi_src/wifi_aim_mayhem_v0.4_arm"
          if [ "$rc" -eq 0 ] && [ -f "$SRC/tools/integrate_into_mayhem.py" ]; then
            record source_layout ok
          else
            record source_layout missing
            find wifi_src -maxdepth 5 -type f | sort >>"$LOG" 2>&1
            [ "$rc" -eq 0 ] && rc=90
          fi

          if [ "$rc" -eq 0 ]; then
            phase CLONE_MAYHEM
            git clone --recursive https://github.com/portapack-mayhem/mayhem-firmware.git mayhem >>"$LOG" 2>&1
            rc=$?
            if [ "$rc" -eq 0 ]; then
              (cd mayhem && git checkout 86584feb163764123ee0c342b9fe14d0e65663bf && git submodule update --init --recursive) >>"$LOG" 2>&1
              rc=$?
            fi
            record clone_rc "$rc"
          fi

          if [ "$rc" -eq 0 ]; then
            phase INTEGRATE
            python3 "$SRC/tools/integrate_into_mayhem.py" "$PWD/mayhem" >>"$LOG" 2>&1
            rc=$?
            record integrate_rc "$rc"
            { grep -n "wifi_aim" mayhem/firmware/application/external/external.cmake || true; grep -n "wifi_aim" mayhem/firmware/application/external/external.ld || true; grep -n "WAIM wifi_aim" mayhem/firmware/baseband/CMakeLists.txt || true; } >>"$LOG" 2>&1
          fi

          if [ "$rc" -eq 0 ]; then
            phase DOCKER_TOOLCHAIN
            (cd mayhem && docker build -t portapack-dev -f dockerfile-nogit .) >>"$LOG" 2>&1
            rc=$?
            record docker_build_rc "$rc"
          fi

          if [ "$rc" -eq 0 ]; then
            phase FULL_MAYHEM_BUILD
            mkdir -p mayhem/build
            (cd mayhem && docker run -e VERSION_STRING=n_wifi_aim_v04 -i -v "$PWD":/havoc portapack-dev) >>"$LOG" 2>&1
            rc=$?
            record full_build_rc "$rc"
          else
            record full_build_rc skipped
          fi

          phase COLLECT
          PPMA="$PWD/mayhem/build/firmware/application/wifi_aim.ppma"
          M4="$PWD/mayhem/build/firmware/baseband/WAIM.bin"
          MAP="$PWD/mayhem/build/firmware/baseband/baseband_wifi_aim.map"
          ELF="$PWD/mayhem/build/firmware/baseband/baseband_wifi_aim.elf"
          for f in "$PPMA" "$M4" "$MAP" "$ELF"; do if [ -f "$f" ]; then cp "$f" "$OUT/"; fi; done

          if [ -f "$PPMA" ]; then
            sz=$(stat -c %s "$PPMA")
            record ppma_size "$sz"
            sha256sum "$PPMA" > "$OUT/SHA256SUMS.txt"
            if [ -f "$M4" ]; then sha256sum "$M4" >> "$OUT/SHA256SUMS.txt"; fi
            base64 -w0 "$PPMA" > "$OUT/wifi_aim.ppma.b64"
            record RESULT SUCCESS
          else
            record RESULT NO_PPMA
          fi
          record final_rc "$rc"
          echo "finished=$(date -u +%FT%TZ)" >> "$OUT/BUILD_STATUS.txt"
          tail -n 800 "$LOG" > "$OUT/BUILD_TAIL.txt"

      - name: Publish build result into repository
        if: always()
        shell: bash
        run: |
          mkdir -p build_results/wifi_aim_v04_diag
          if [ ! -f build_results/wifi_aim_v04_diag/BUILD_STATUS.txt ]; then printf '%s\n' 'RESULT=WORKFLOW_FAILED_BEFORE_DIAGNOSTICS' > build_results/wifi_aim_v04_diag/BUILD_STATUS.txt; fi
          git config user.name 'wifi-aim-builder'
          git config user.email 'actions@users.noreply.github.com'
          git add -f build_results/wifi_aim_v04_diag
          git commit -m 'Publish WiFi AIM V0.4 diagnostic build result' || true
          git pull --rebase origin main || true
          git push origin HEAD:main || true

      - name: Upload WiFi AIM V0.4 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wifi-aim-v04-diag
          path: build_results/wifi_aim_v04_diag/*
          if-no-files-found: warn
