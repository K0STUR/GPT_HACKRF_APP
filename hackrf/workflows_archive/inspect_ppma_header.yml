name: Inspect WiFi AIM PPMA header

on:
  push:
    paths:
      - '.github/workflows/inspect_ppma_header.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect binaries
        shell: bash
        run: |
          python3 - <<'PY' > build_results/PPMA_HEADER_INSPECT.txt
          from pathlib import Path
          import struct, hashlib
          for fn in [
            'build_results/wifi_aim_probe_n260808/WiFiAimProbe_n260808.ppma',
            'build_results/wifi_aim_full_n260808/WiFiAIM_n260808.ppma',
            'build_results/wifi_aim_full_n260808_fix1/WiFiAIM_n260808_fix1.ppma',
            'build_results/wifi_aim_lowmem_n260808/WiFiAIM_n260808_lowmem.ppma',
          ]:
            p=Path(fn)
            if not p.exists(): continue
            b=p.read_bytes(); mem,entry=struct.unpack_from('<II',b,0)
            start=(entry&~1)-mem
            print('\nFILE',fn)
            print('size',len(b),'sha256',hashlib.sha256(b).hexdigest())
            print(f'mem=0x{mem:08X} entry=0x{entry:08X} start=0x{start:X}')
            print('first96',b[:96].hex(' '))
            for off in [68,72,76,80,84]:
              if off+4<=len(b):
                raw=b[off:off+4]
                print(f'@{off}: raw={raw!r} u32=0x{struct.unpack("<I",raw)[0]:08X}')
            # GCC output for nav.push<T>() loads sizeof(T) from literal at entry+0x2C in these builds.
            lit=start+0x2c
            if lit+4<=len(b): print(f'entry_literal_plus_0x2c=0x{struct.unpack_from("<I",b,lit)[0]:08X}')
          PY
          git config user.name 'wifi-aim-builder'
          git config user.email 'actions@users.noreply.github.com'
          git add -f build_results/PPMA_HEADER_INSPECT.txt
          git commit -m 'Publish PPMA header and allocation inspection' || true
          git pull --rebase origin main || true
          git push origin HEAD:main || true
