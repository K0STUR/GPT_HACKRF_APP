name: Build WiFi AIM n_260808 fix5 SignalHunter slot

on:
  push:
    paths:
      - '.github/workflows/build_wifi_aim_full_n260808_fix5_signalhunter.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct WiFi AIM sources
        shell: bash
        run: |
          set -euo pipefail
          cat wifi_aim_n260808/src.part* > /tmp/wifi_aim_src.b64
          base64 -d /tmp/wifi_aim_src.b64 > /tmp/wifi_aim_src.tar.gz
          echo '294072ffe25e369fee1276cca11ea6a374fc27b2e09a081eb444eabd8eb01cb9  /tmp/wifi_aim_src.tar.gz' | sha256sum -c -
          mkdir -p wifi_src
          tar -xzf /tmp/wifi_aim_src.tar.gz -C wifi_src
          test -f wifi_src/firmware/application/external/wifi_aim/main.cpp
          test -f wifi_src/firmware/application/external/wifi_aim/ui_wifi_aim.cpp
          test -f wifi_src/firmware/baseband/proc_wifi_aim.cpp

      - name: Checkout exact stock Mayhem n_260808
        run: |
          git clone --recursive https://github.com/portapack-mayhem/mayhem-firmware.git mayhem
          cd mayhem
          git checkout nightly-tag-2026-08-08
          git submodule update --init --recursive
          test "$(git rev-parse HEAD)" = "367eaf54c0f51f62448d9f2d9585fd3629f6b770"

      - name: Replace existing Signal Hunter external slot with WiFi AIM
        shell: bash
        run: |
          set -euo pipefail

          # IMPORTANT: no new M0 source files and no new external-app slot are added.
          # WiFi AIM replaces the already-existing signal_hunter external app objects,
          # preserving the stock n_260808 core ABI/address layout.
          cp wifi_src/firmware/application/external/wifi_aim/main.cpp \
             mayhem/firmware/application/external/signal_hunter/main.cpp
          cp wifi_src/firmware/application/external/wifi_aim/ui_wifi_aim.cpp \
             mayhem/firmware/application/external/signal_hunter/ui_signal_hunter.cpp
          cp wifi_src/firmware/application/external/wifi_aim/ui_wifi_aim.hpp \
             mayhem/firmware/application/external/signal_hunter/ui_signal_hunter.hpp

          cp wifi_src/firmware/baseband/proc_wifi_aim.cpp mayhem/firmware/baseband/proc_signal_hunter.cpp
          cp wifi_src/firmware/baseband/proc_wifi_aim.hpp mayhem/firmware/baseband/proc_signal_hunter.hpp
          cp wifi_src/firmware/common/wifi_aim_wire.hpp mayhem/firmware/common/
          rm -rf mayhem/firmware/common/wifi_aim
          cp -a wifi_src/firmware/common/wifi_aim mayhem/firmware/common/

          python3 - <<'PY'
          from pathlib import Path

          d=Path('mayhem/firmware/application/external/signal_hunter')
          for name in ['main.cpp','ui_signal_hunter.cpp','ui_signal_hunter.hpp']:
              p=d/name; s=p.read_text()
              s=s.replace('ui_wifi_aim.hpp','ui_signal_hunter.hpp')
              s=s.replace('ui::external_app::wifi_aim','ui::external_app::signal_hunter')
              s=s.replace('namespace ui::external_app::wifi_aim','namespace ui::external_app::signal_hunter')
              s=s.replace('} // namespace ui::external_app::wifi_aim','} // namespace ui::external_app::signal_hunter')
              s=s.replace('.external_app.app_wifi_aim.application_information','.external_app.app_signal_hunter.application_information')
              s=s.replace('_application_information_wifi_aim','_application_information_signal_hunter')
              s=s.replace("{'W','A','I','M'}", "{'H','U','N','T'}")
              s=s.replace("{'W', 'A', 'I', 'M'}", "{'H', 'U', 'N', 'T'}")
              p.write_text(s)

          # M4 keeps the existing HUNT image/tag, only processor implementation changes.
          p=Path('mayhem/firmware/baseband/proc_signal_hunter.cpp')
          s=p.read_text().replace('#include "proc_wifi_aim.hpp"','#include "proc_signal_hunter.hpp"')
          p.write_text(s)

          # Put every allocatable section generated by the two signal_hunter M0 objects
          # into the existing external slot. Nothing from WiFi AIM may leak into stock .text/.rodata.
          p=Path('mayhem/firmware/application/external/external.ld')
          s=p.read_text()
          old='''    .external_app_signal_hunter : ALIGN(4) SUBALIGN(4)\n    {\n      KEEP(*(.external_app.app_signal_hunter.application_information));\n      */external/signal_hunter/*(*ui*external_app*signal_hunter*);\n    } > ram_external_app_signal_hunter'''
          new='''    .external_app_signal_hunter : ALIGN(4) SUBALIGN(4)\n    {\n      KEEP(*(.external_app.app_signal_hunter.application_information));\n      */external/signal_hunter/*(.text* .rodata* .data* .gnu.linkonce* .ARM.extab* .ARM.exidx*);\n      . = ALIGN(4);\n    } > ram_external_app_signal_hunter'''
          assert old in s, 'signal_hunter linker block did not match stock n_260808'
          s=s.replace(old,new,1)
          p.write_text(s)

          # Reuse the stock HUNT target; add our PHY source and keep it size-oriented.
          p=Path('mayhem/firmware/baseband/CMakeLists.txt')
          s=p.read_text()
          old='''### Signal Hunter\n\nset(MODE_CPPSRC\n    proc_signal_hunter.cpp\n)\nDeclareTargets(HUNT signal_hunter)'''
          new='''### Signal Hunter / WiFi AIM test\n\nset(MODE_FLAGS "-Os")\nset(MODE_CPPSRC\n    proc_signal_hunter.cpp\n    ${COMMON}/wifi_aim/wifi_aim_phy.cpp\n)\nDeclareTargets(HUNT signal_hunter)\nset(MODE_FLAGS "-O3")'''
          assert old in s, 'HUNT target block did not match stock n_260808'
          s=s.replace(old,new,1)
          p.write_text(s)
          PY

          grep -n -A7 '.external_app_signal_hunter' mayhem/firmware/application/external/external.ld | tail -10
          grep -n -A8 'Signal Hunter / WiFi AIM' mayhem/firmware/baseband/CMakeLists.txt
          grep -n 'm4_app_tag' mayhem/firmware/application/external/signal_hunter/main.cpp

      - name: Build official Mayhem toolchain
        run: |
          cd mayhem
          docker build -t portapack-dev -f dockerfile-nogit .
          mkdir -p build
          docker run -e VERSION_STRING=n_260808 -i -v "$PWD":/havoc portapack-dev

      - name: Verify stock ABI and PPMA loader invariants
        shell: bash
        run: |
          set -euo pipefail
          OUT=build_results/wifi_aim_full_n260808_fix5
          rm -rf "$OUT"; mkdir -p "$OUT"
          PPMA=mayhem/build/firmware/application/signal_hunter.ppma
          test -f "$PPMA"
          cp "$PPMA" "$OUT/WiFiAIM_n260808_fix5.ppma"
          cp mayhem/build/firmware/baseband/HUNT.bin "$OUT/HUNT.bin"

          docker run --rm --entrypoint sh -v "$PWD/mayhem":/havoc portapack-dev -lc \
            "arm-none-eabi-nm -n /havoc/build/firmware/application/application.elf | grep -E ' (_Znwj|_ZdlPv|_Znaj)$'" \
            > "$OUT/CORE_SYMBOLS.txt" || true

          python3 - <<'PY' > "$OUT/VERIFY.txt"
          import struct, hashlib
          from pathlib import Path
          p=Path('build_results/wifi_aim_full_n260808_fix5/WiFiAIM_n260808_fix5.ppma')
          b=p.read_bytes()
          mem,entry,hdr,ver=struct.unpack_from('<IIII',b,0)
          tag=b[76:80]; off=struct.unpack_from('<I',b,80)[0]
          def csum(d):
              if len(d)%4: d+=b'\0'*(4-len(d)%4)
              return sum(struct.unpack('<%dI'%(len(d)//4),d)) & 0xffffffff
          total=0; i=0
          while i<off:
              n=min(512,off-i); ch=b[i:i+n]; total=(total+csum(ch))&0xffffffff
              if len(ch)<512: break
              i+=512
          i=off
          while True:
              n=512-(i%512) if i%512 else 512
              ch=b[i:i+n]
              if not ch: break
              total=(total+csum(ch))&0xffffffff
              if len(ch)!=n: break
              i+=len(ch)
          core=Path('build_results/wifi_aim_full_n260808_fix5/CORE_SYMBOLS.txt').read_text(errors='ignore')
          stock_new=('0007ee24' in core.lower())
          print(f'size={len(b)}')
          print(f'memory=0x{mem:08X} entry=0x{entry:08X}')
          print(f'header={hdr} version=0x{ver:08X} tag={tag!r}')
          print(f'm4_offset={off} mod4={off%4}')
          print(f'loader_checksum=0x{total:08X}')
          print('core_symbols='+core.strip().replace('\n',' | '))
          print('stock_operator_new_match='+str(stock_new))
          print('sha256='+hashlib.sha256(b).hexdigest())
          ok=(hdr==3 and tag==b'HUNT' and off%4==0 and total==0 and (entry&1)==1 and stock_new)
          print('RESULT='+('PASS' if ok else 'FAIL'))
          if not ok: raise SystemExit(2)
          PY

          sha256sum "$OUT/WiFiAIM_n260808_fix5.ppma" > "$OUT/SHA256SUMS.txt"
          base64 -w0 "$OUT/WiFiAIM_n260808_fix5.ppma" > "$OUT/WiFiAIM_n260808_fix5.ppma.b64"
          cat "$OUT/VERIFY.txt"

      - name: Publish successful result
        shell: bash
        run: |
          OUT=build_results/wifi_aim_full_n260808_fix5
          git config user.name 'wifi-aim-builder'
          git config user.email 'actions@users.noreply.github.com'
          git add -f "$OUT"
          git commit -m 'Publish WiFi AIM n_260808 fix5 SignalHunter-slot build' || true
          git pull --rebase origin main || true
          git push origin HEAD:main || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wifi-aim-full-n260808-fix5
          path: build_results/wifi_aim_full_n260808_fix5/*
          if-no-files-found: error
