name: Diagnose WiFi AIM first call
on:
  push:
    paths: ['.github/workflows/diag_wifi_aim_first_call.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet capstone
      - shell: bash
        run: |
          python3 - <<'PY' > build_results/WIFI_AIM_FIRST_CALL.txt
          from pathlib import Path
          import struct
          from capstone import Cs, CS_ARCH_ARM, CS_MODE_THUMB, CS_MODE_LITTLE_ENDIAN
          md=Cs(CS_ARCH_ARM,CS_MODE_THUMB|CS_MODE_LITTLE_ENDIAN)
          files=[
            'build_results/wifi_aim_probe_n260808/WiFiAimProbe_n260808.ppma',
            'build_results/wifi_aim_full_n260808_fix1/WiFiAIM_n260808_fix1.ppma',
            'build_results/wifi_aim_lowmem_n260808/WiFiAIM_n260808_lowmem.ppma']
          for fn in files:
            b=Path(fn).read_bytes(); mem,entry=struct.unpack_from('<II',b,0); off=struct.unpack_from('<I',b,80)[0]; code=b[:off]; start=(entry&~1)-mem
            ins=list(md.disasm(code[start:start+40],entry&~1))
            print('\nFILE',fn,'mem',hex(mem),'entry',hex(entry),'m4off',off)
            for i in ins: print(hex(i.address),i.mnemonic,i.op_str)
            bl=next((i for i in ins if i.mnemonic=='bl'),None)
            if not bl: continue
            target=int(bl.op_str.lstrip('#'),16); toff=target-mem
            print('FIRST_BL_TARGET',hex(target),'fileoff',hex(toff))
            print('target_raw',code[toff:toff+32].hex())
            # Standard external-app call veneer is 12 bytes + a 32-bit absolute target literal.
            if 0 <= toff+12 <= len(code)-4:
              print('veneer_literal_u32',hex(struct.unpack_from('<I',code,toff+12)[0]))
            for i in md.disasm(code[toff:toff+32],target): print(hex(i.address),i.mnemonic,i.op_str)
          PY
          git config user.name wifi-aim-builder
          git config user.email actions@users.noreply.github.com
          git add -f build_results/WIFI_AIM_FIRST_CALL.txt
          git commit -m 'Publish probe vs WiFi AIM veneer comparison' || true
          git pull --rebase origin main || true
          git push origin HEAD:main || true
