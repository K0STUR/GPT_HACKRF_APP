name: Build WiFi AIM n_260808 fix6 local-MAC ABI-remap

on:
  push:
    paths:
      - '.github/workflows/build_wifi_aim_full_n260808_fix6.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct WiFi AIM sources
        shell: bash
        run: |
          set -euo pipefail
          cat wifi_aim_n260808/src.part* > /tmp/wifi_aim_src.b64
          base64 -d /tmp/wifi_aim_src.b64 > /tmp/wifi_aim_src.tar.gz
          echo '294072ffe25e369fee1276cca11ea6a374fc27b2e09a081eb444eabd8eb01cb9  /tmp/wifi_aim_src.tar.gz' | sha256sum -c -
          rm -rf wifi_src
          mkdir -p wifi_src
          tar -xzf /tmp/wifi_aim_src.tar.gz -C wifi_src
          test -f wifi_src/firmware/application/external/wifi_aim/main.cpp
          test -f wifi_src/firmware/application/external/wifi_aim/ui_wifi_aim.cpp
          test -f wifi_src/firmware/baseband/proc_wifi_aim.cpp

      - name: Remove non-stock to_string_mac_address dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path('wifi_src/firmware/application/external/wifi_aim')
          ui = root / 'ui_wifi_aim.cpp'
          s = ui.read_text()

          hits = []
          for p in root.rglob('*'):
              if p.is_file() and p.suffix in {'.cpp', '.hpp', '.h', '.cc'}:
                  t = p.read_text(errors='ignore')
                  n = t.count('to_string_mac_address(')
                  if n:
                      hits.append((str(p), n))
          print('original_to_string_mac_address_hits=', hits)
          assert hits, 'WiFi AIM source no longer contains to_string_mac_address; review fix6 assumptions'
          assert all(Path(p) == ui for p, _ in hits), f'unexpected MAC formatter call outside ui_wifi_aim.cpp: {hits}'

          anchor = 'namespace ui::external_app::wifi_aim {'
          assert anchor in s, 'wifi_aim namespace anchor not found'
          helper = r'''

          // Keep BSSID formatting inside the external app. The stock n_260808
          // application image does not retain an out-of-line to_string_mac_address
          // symbol, so importing it from a .ppma creates an ABI dependency that
          // cannot be rebased to the stock firmware. Match Mayhem's semantics:
          // uppercase hexadecimal, and the third argument means noColon.
          static std::string wifi_aim_local_mac_string(const uint8_t* mac, uint8_t length, bool noColon) {
              if (!mac || length == 0) return {};
              // WiFi AIM passes BSSIDs (6 bytes). Keep a bounded local buffer so
              // formatting itself does not add another core helper dependency.
              if (length > 6) length = 6;
              constexpr char digits[] = "0123456789ABCDEF";
              char out[18]{};
              size_t pos = 0;
              for (uint8_t i = 0; i < length; ++i) {
                  if (i && !noColon) out[pos++] = ':';
                  out[pos++] = digits[(mac[i] >> 4) & 0x0F];
                  out[pos++] = digits[mac[i] & 0x0F];
              }
              out[pos] = '\0';
              return std::string(out);
          }
          '''
          s = s.replace(anchor, anchor + helper, 1)
          old_count = s.count('to_string_mac_address(')
          assert old_count > 0
          s = s.replace('to_string_mac_address(', 'wifi_aim_local_mac_string(')
          assert 'to_string_mac_address(' not in s
          ui.write_text(s)

          remaining = []
          for p in root.rglob('*'):
              if p.is_file() and p.suffix in {'.cpp', '.hpp', '.h', '.cc'}:
                  if 'to_string_mac_address(' in p.read_text(errors='ignore'):
                      remaining.append(str(p))
          assert not remaining, f'unpatched MAC formatter dependency remains: {remaining}'
          print(f'patched_calls={old_count}')
          PY

      - name: Checkout exact stock Mayhem n_260808 twice
        shell: bash
        run: |
          set -euo pipefail
          git clone --recursive https://github.com/portapack-mayhem/mayhem-firmware.git mayhem_stock
          cd mayhem_stock
          git checkout nightly-tag-2026-08-08
          git submodule update --init --recursive
          test "$(git rev-parse HEAD)" = "367eaf54c0f51f62448d9f2d9585fd3629f6b770"
          cd ..
          git clone --recursive https://github.com/portapack-mayhem/mayhem-firmware.git mayhem_mod
          cd mayhem_mod
          git checkout nightly-tag-2026-08-08
          git submodule update --init --recursive
          test "$(git rev-parse HEAD)" = "367eaf54c0f51f62448d9f2d9585fd3629f6b770"

      - name: Build official toolchain image
        shell: bash
        run: |
          set -euo pipefail
          cd mayhem_stock
          docker build -t portapack-dev -f dockerfile-nogit .

      - name: Build untouched stock n_260808 and save symbol map
        shell: bash
        run: |
          set -euo pipefail
          cd mayhem_stock
          mkdir -p build
          docker run -e VERSION_STRING=n_260808 -i -v "$PWD":/havoc portapack-dev
          docker run --rm --entrypoint sh -v "$PWD":/havoc portapack-dev -lc \
            "arm-none-eabi-nm -n /havoc/build/firmware/application/application.elf" > ../stock_nm.txt

      - name: Integrate WiFi AIM with isolated M0 section
        shell: bash
        run: |
          set -euo pipefail
          cp -a wifi_src/firmware/application/external/wifi_aim mayhem_mod/firmware/application/external/
          cp wifi_src/firmware/baseband/proc_wifi_aim.* mayhem_mod/firmware/baseband/
          cp wifi_src/firmware/common/wifi_aim_wire.hpp mayhem_mod/firmware/common/
          cp -a wifi_src/firmware/common/wifi_aim mayhem_mod/firmware/common/
          python3 - <<'PY'
          from pathlib import Path
          root=Path('mayhem_mod')

          p=root/'firmware/application/external/external.cmake'; s=p.read_text()
          a='  external/signal_hunter/ui_signal_hunter.cpp'
          if 'external/wifi_aim/main.cpp' not in s:
              s=s.replace(a,a+'\n\n  #wifi_aim\n  external/wifi_aim/main.cpp\n  external/wifi_aim/ui_wifi_aim.cpp',1)
          la='  signal_hunter\n'
          if '\twifi_aim\n' not in s and '  wifi_aim\n' not in s:
              s=s.replace(la,la+'\twifi_aim\n',1)
          p.write_text(s)

          p=root/'firmware/application/external/external.ld'; s=p.read_text()
          ma='    ram_external_app_tetra_rx              (rwx) : org = 0xAE0C0000, len = 32k'
          if 'ram_external_app_wifi_aim' not in s:
              s=s.replace(ma,ma+'\n    ram_external_app_wifi_aim              (rwx) : org = 0xAE0D0000, len = 32k',1)
          sa='} > ram_external_app_signal_hunter'
          if '.external_app_wifi_aim' not in s:
              block='''\n\n    .external_app_wifi_aim : ALIGN(4) SUBALIGN(4)\n    {\n        KEEP(*(.external_app.app_wifi_aim.application_information));\n        */external/wifi_aim/*(.text* .rodata* .data* .gnu.linkonce* .ARM.extab* .ARM.exidx*);\n        . = ALIGN(4);\n    } > ram_external_app_wifi_aim'''
              s=s.replace(sa,sa+block,1)
          p.write_text(s)

          p=root/'firmware/tools/external_app_info.py'; s=p.read_text()
          s=s.replace('external_apps_address_end = 0xAE0B0000','external_apps_address_end = 0xAE0E0000')
          p.write_text(s)

          p=root/'firmware/baseband/CMakeLists.txt'; s=p.read_text(); a='DeclareTargets(HUNT signal_hunter)'
          if 'DeclareTargets(WAIM wifi_aim)' not in s:
              s=s.replace(a,a+'''\n\n### WiFi AIM\nset(MODE_FLAGS "-Os")\nset(MODE_CPPSRC\n    proc_wifi_aim.cpp\n    ${COMMON}/wifi_aim/wifi_aim_phy.cpp\n)\nDeclareTargets(WAIM wifi_aim)\nset(MODE_FLAGS "-O3")''',1)
          p.write_text(s)
          PY

      - name: Build modified WiFi AIM tree and save symbol map
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p hackrf/build_results/wifi_aim_full_n260808_fix6
          cd mayhem_mod
          mkdir -p build
          set -o pipefail
          docker run -e VERSION_STRING=n_260808 -i -v "$PWD":/havoc portapack-dev 2>&1 | tee ../hackrf_fix6_build.log
          docker run --rm --entrypoint sh -v "$PWD":/havoc portapack-dev -lc \
            "arm-none-eabi-nm -n /havoc/build/firmware/application/application.elf" > ../mod_nm.txt
          cd ..
          cp hackrf_fix6_build.log hackrf/build_results/wifi_aim_full_n260808_fix6/BUILD.log

      - name: Remap external-app core references to exact stock ABI
        shell: bash
        run: |
          set -euo pipefail
          OUT=hackrf/build_results/wifi_aim_full_n260808_fix6
          cp mayhem_mod/build/firmware/application/wifi_aim.ppma /tmp/in.ppma
          cp mayhem_mod/build/firmware/baseband/WAIM.bin "$OUT/WAIM.bin"
          python3 - <<'PY'
          from pathlib import Path
          import struct, hashlib, base64

          MACSYM='_Z21to_string_mac_addressB5cxx11PKhhb'

          def read_nm(path):
              by_name={}; by_addr={}
              for line in Path(path).read_text(errors='ignore').splitlines():
                  parts=line.split(None,2)
                  if len(parts)!=3: continue
                  a,t,n=parts
                  try: addr=int(a,16)
                  except: continue
                  if t not in 'TtWwDdBbRrVv': continue
                  by_name.setdefault(n,[]).append(addr)
                  by_addr.setdefault(addr,[]).append(n)
              return by_name,by_addr

          stock_name,stock_addr=read_nm('stock_nm.txt')
          mod_name,mod_addr=read_nm('mod_nm.txt')
          src=bytearray(Path('/tmp/in.ppma').read_bytes())
          mem,entry,hdr,ver=struct.unpack_from('<IIII',src,0)
          tag=bytes(src[76:80])
          m4off=struct.unpack_from('<I',src,80)[0]
          assert m4off%4==0

          patches=[]; unresolved=[]; ambiguous=[]
          for off in range(0,m4off,4):
              val=struct.unpack_from('<I',src,off)[0]
              thumb=val&1
              base=val&~1
              names=mod_addr.get(base,[])
              if not names: continue
              if 0x10080000 <= base < 0x10090000: continue
              candidates=[]
              missing=[]
              for name in names:
                  if name in stock_name:
                      candidates.extend(stock_name[name])
                  else:
                      missing.append(name)
              candidates=sorted(set(candidates))
              if len(candidates)==1:
                  newbase=candidates[0]
                  newval=newbase | thumb
                  if newval!=val:
                      patches.append((off,val,newval,names))
                      struct.pack_into('<I',src,off,newval)
              elif len(candidates)>1:
                  ambiguous.append((off,val,names,candidates))
              elif missing:
                  if base < 0x00100000 or (0x10000000 <= base < 0x10080000) or (0x20000000 <= base < 0x20040000):
                      unresolved.append((off,val,missing))

          body=src[:-4]
          assert len(body)%4==0
          total=sum(struct.unpack_from('<I',body,i)[0] for i in range(0,len(body),4)) & 0xffffffff
          struct.pack_into('<I',src,len(src)-4,(-total)&0xffffffff)
          final=sum(struct.unpack_from('<I',src,i)[0] for i in range(0,len(src),4)) & 0xffffffff

          outdir=Path('hackrf/build_results/wifi_aim_full_n260808_fix6')
          out=outdir/'WiFiAIM_n260808_fix6.ppma'
          out.write_bytes(src)
          sha=hashlib.sha256(src).hexdigest()

          report=[]
          report.append(f'size={len(src)}')
          report.append(f'memory=0x{mem:08X}')
          report.append(f'entry=0x{entry:08X}')
          report.append(f'header={hdr}')
          report.append(f'version=0x{ver:08X}')
          report.append(f'tag={tag!r}')
          report.append(f'm4_offset={m4off}')
          report.append(f'patch_count={len(patches)}')
          for off,old,new,names in patches:
              report.append(f'PATCH off=0x{off:04X} 0x{old:08X}->0x{new:08X} names={names}')
          report.append(f'ambiguous_count={len(ambiguous)}')
          for x in ambiguous[:50]: report.append('AMBIG '+repr(x))
          report.append(f'unresolved_count={len(unresolved)}')
          for x in unresolved[:50]: report.append('UNRES '+repr(x))
          report.append(f'final_checksum=0x{final:08X}')
          report.append('stock_operator_new=' + ','.join(hex(x) for x in stock_name.get('_Znwj',[])))
          report.append('mod_operator_new=' + ','.join(hex(x) for x in mod_name.get('_Znwj',[])))
          report.append('stock_to_string_mac_address=' + ','.join(hex(x) for x in stock_name.get(MACSYM,[])))
          report.append('mod_to_string_mac_address=' + ','.join(hex(x) for x in mod_name.get(MACSYM,[])))
          report.append('sha256='+sha)

          ok=(
              len(src) < 32768 and
              hdr == 3 and
              tag == b'WAIM' and
              (entry & 1) == 1 and
              m4off % 4 == 0 and
              final == 0 and
              len(patches) > 0 and
              len(unresolved) == 0 and
              len(ambiguous) == 0 and
              stock_name.get('_Znwj') == [0x7ee24] and
              not stock_name.get(MACSYM) and
              not mod_name.get(MACSYM)
          )
          report.append('RESULT=' + ('PASS' if ok else 'FAIL'))
          (outdir/'VERIFY.txt').write_text('\n'.join(report)+'\n')
          (outdir/'SHA256SUMS.txt').write_text(f'{sha}  WiFiAIM_n260808_fix6.ppma\n')
          (outdir/'WiFiAIM_n260808_fix6.ppma.b64').write_text(base64.b64encode(src).decode())
          if not ok:
              raise SystemExit(2)
          PY
          cat "$OUT/VERIFY.txt"

      - name: Publish fix6 result and diagnostics
        if: always()
        shell: bash
        run: |
          OUT=hackrf/build_results/wifi_aim_full_n260808_fix6
          mkdir -p "$OUT"
          if [ ! -f "$OUT/STATUS.txt" ]; then
            if [ -f "$OUT/VERIFY.txt" ] && grep -q '^RESULT=PASS$' "$OUT/VERIFY.txt"; then
              printf 'WiFi AIM n_260808 fix6\nRESULT=PASS\nPurpose=remove non-stock to_string_mac_address dependency and require zero unresolved/ambiguous stock-ABI imports\n' > "$OUT/STATUS.txt"
            else
              printf 'WiFi AIM n_260808 fix6\nRESULT=INCOMPLETE_OR_FAIL\nInspect BUILD.log and VERIFY.txt when present.\n' > "$OUT/STATUS.txt"
            fi
          fi
          git config user.name 'wifi-aim-builder'
          git config user.email 'actions@users.noreply.github.com'
          git add -f "$OUT" || true
          git commit -m 'Publish WiFi AIM n_260808 fix6 stock-ABI build' || true
          git pull --rebase origin main || true
          git push origin HEAD:main || true

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wifi-aim-full-n260808-fix6
          path: hackrf/build_results/wifi_aim_full_n260808_fix6/*
          if-no-files-found: warn
