name: Build WiFi AIM n_260808 fix7 pretrigger diagnostics

on:
  push:
    paths:
      - '.github/workflows/build_wifi_aim_full_n260808_fix7.yml'
  pull_request:
    paths:
      - 'hackrf/FIX7_TRIGGER.txt'
      - '.github/workflows/build_wifi_aim_full_n260808_fix7.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare Fix7 WiFi AIM sources
        shell: bash
        run: |
          set -euo pipefail
          rm -rf wifi_src
          mkdir -p wifi_src/firmware/application/external wifi_src/firmware/baseband wifi_src/firmware/common
          cp -a hackrf/source_expanded/firmware/application/external/wifi_aim wifi_src/firmware/application/external/
          cp hackrf/source_expanded/firmware/baseband/proc_wifi_aim.* wifi_src/firmware/baseband/
          cp hackrf/source_expanded/firmware/common/wifi_aim_wire.hpp wifi_src/firmware/common/
          cp -a hackrf/source_expanded/firmware/common/wifi_aim wifi_src/firmware/common/
          grep -q 'kPretriggerSamples' wifi_src/firmware/baseband/proc_wifi_aim.hpp
          grep -q 'Message::ID::HunterTrigger' wifi_src/firmware/application/external/wifi_aim/ui_wifi_aim.hpp
          grep -q 'timer_ms_ >= 1000' wifi_src/firmware/application/external/wifi_aim/ui_wifi_aim.cpp

      - name: Remove non-stock MAC formatter dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          ui=Path('wifi_src/firmware/application/external/wifi_aim/ui_wifi_aim.cpp')
          s=ui.read_text()
          anchor='namespace ui::external_app::wifi_aim {'
          assert anchor in s
          helper=r'''

          static std::string wifi_aim_local_mac_string(const uint8_t* mac, uint8_t length, bool noColon) {
              if (!mac || length == 0) return {};
              if (length > 6) length = 6;
              constexpr char digits[] = "0123456789ABCDEF";
              char out[18]{};
              size_t pos = 0;
              for (uint8_t i = 0; i < length; ++i) {
                  if (i && !noColon) out[pos++] = ':';
                  out[pos++] = digits[(mac[i] >> 4) & 0x0F];
                  out[pos++] = digits[mac[i] & 0x0F];
              }
              out[pos] = '\0';
              return std::string(out);
          }
          '''
          s=s.replace(anchor,anchor+helper,1)
          n=s.count('to_string_mac_address(')
          assert n > 0
          s=s.replace('to_string_mac_address(','wifi_aim_local_mac_string(')
          assert 'to_string_mac_address(' not in s
          ui.write_text(s)
          print('patched_mac_calls=',n)
          PY

      - name: Checkout exact stock Mayhem n_260808 twice
        shell: bash
        run: |
          set -euo pipefail
          git clone --recursive https://github.com/portapack-mayhem/mayhem-firmware.git mayhem_stock
          cd mayhem_stock
          git checkout nightly-tag-2026-08-08
          git submodule update --init --recursive
          test "$(git rev-parse HEAD)" = "367eaf54c0f51f62448d9f2d9585fd3629f6b770"
          cd ..
          git clone --recursive https://github.com/portapack-mayhem/mayhem-firmware.git mayhem_mod
          cd mayhem_mod
          git checkout nightly-tag-2026-08-08
          git submodule update --init --recursive
          test "$(git rev-parse HEAD)" = "367eaf54c0f51f62448d9f2d9585fd3629f6b770"

      - name: Build official toolchain image
        shell: bash
        run: |
          set -euo pipefail
          cd mayhem_stock
          docker build -t portapack-dev -f dockerfile-nogit .

      - name: Build untouched stock and save symbol map
        shell: bash
        run: |
          set -euo pipefail
          cd mayhem_stock
          mkdir -p build
          docker run -e VERSION_STRING=n_260808 -i -v "$PWD":/havoc portapack-dev
          docker run --rm --entrypoint sh -v "$PWD":/havoc portapack-dev -lc \
            "arm-none-eabi-nm -n /havoc/build/firmware/application/application.elf" > ../stock_nm.txt

      - name: Integrate Fix7 into isolated external app section
        shell: bash
        run: |
          set -euo pipefail
          cp -a wifi_src/firmware/application/external/wifi_aim mayhem_mod/firmware/application/external/
          cp wifi_src/firmware/baseband/proc_wifi_aim.* mayhem_mod/firmware/baseband/
          cp wifi_src/firmware/common/wifi_aim_wire.hpp mayhem_mod/firmware/common/
          cp -a wifi_src/firmware/common/wifi_aim mayhem_mod/firmware/common/
          python3 - <<'PY'
          from pathlib import Path
          root=Path('mayhem_mod')

          p=root/'firmware/application/external/external.cmake'; s=p.read_text()
          a='  external/signal_hunter/ui_signal_hunter.cpp'
          if 'external/wifi_aim/main.cpp' not in s:
              s=s.replace(a,a+'\n\n  #wifi_aim\n  external/wifi_aim/main.cpp\n  external/wifi_aim/ui_wifi_aim.cpp',1)
          la='  signal_hunter\n'
          if '\twifi_aim\n' not in s and '  wifi_aim\n' not in s:
              s=s.replace(la,la+'\twifi_aim\n',1)
          p.write_text(s)

          p=root/'firmware/application/external/external.ld'; s=p.read_text()
          ma='    ram_external_app_tetra_rx              (rwx) : org = 0xAE0C0000, len = 32k'
          if 'ram_external_app_wifi_aim' not in s:
              s=s.replace(ma,ma+'\n    ram_external_app_wifi_aim              (rwx) : org = 0xAE0D0000, len = 32k',1)
          sa='} > ram_external_app_signal_hunter'
          if '.external_app_wifi_aim' not in s:
              block='''\n\n    .external_app_wifi_aim : ALIGN(4) SUBALIGN(4)\n    {\n        KEEP(*(.external_app.app_wifi_aim.application_information));\n        */external/wifi_aim/*(.text* .rodata* .data* .gnu.linkonce* .ARM.extab* .ARM.exidx*);\n        . = ALIGN(4);\n    } > ram_external_app_wifi_aim'''
              s=s.replace(sa,sa+block,1)
          p.write_text(s)

          p=root/'firmware/tools/external_app_info.py'; s=p.read_text()
          s=s.replace('external_apps_address_end = 0xAE0B0000','external_apps_address_end = 0xAE0E0000')
          p.write_text(s)

          p=root/'firmware/baseband/CMakeLists.txt'; s=p.read_text(); a='DeclareTargets(HUNT signal_hunter)'
          if 'DeclareTargets(WAIM wifi_aim)' not in s:
              s=s.replace(a,a+'''\n\n### WiFi AIM\nset(MODE_FLAGS "-Os")\nset(MODE_CPPSRC\n    proc_wifi_aim.cpp\n    ${COMMON}/wifi_aim/wifi_aim_phy.cpp\n)\nDeclareTargets(WAIM wifi_aim)\nset(MODE_FLAGS "-O3")''',1)
          p.write_text(s)
          PY

      - name: Build modified Fix7 tree
        shell: bash
        run: |
          set -euo pipefail
          OUT=hackrf/build_results/wifi_aim_full_n260808_fix7
          rm -rf "$OUT" && mkdir -p "$OUT"
          cd mayhem_mod
          mkdir -p build
          set -o pipefail
          docker run -e VERSION_STRING=n_260808 -i -v "$PWD":/havoc portapack-dev 2>&1 | tee ../hackrf_fix7_build.log
          docker run --rm --entrypoint sh -v "$PWD":/havoc portapack-dev -lc \
            "arm-none-eabi-nm -n /havoc/build/firmware/application/application.elf" > ../mod_nm.txt
          cd ..
          cp hackrf_fix7_build.log "$OUT/BUILD.log"

      - name: Audit zero-drift stock ABI and final PPMA
        shell: bash
        run: |
          set -euo pipefail
          OUT=hackrf/build_results/wifi_aim_full_n260808_fix7
          cp mayhem_mod/build/firmware/application/wifi_aim.ppma /tmp/in.ppma
          cp mayhem_mod/build/firmware/baseband/WAIM.bin "$OUT/WAIM.bin"
          test -s /tmp/in.ppma && test -s "$OUT/WAIM.bin"
          python3 - <<'PY'
          from pathlib import Path
          import struct, hashlib, base64
          MACSYM='_Z21to_string_mac_addressB5cxx11PKhhb'
          EXPECTED_VERSION=0x86B64C1D

          def read_nm(path):
              by_name={}; by_addr={}
              for line in Path(path).read_text(errors='ignore').splitlines():
                  parts=line.split(None,2)
                  if len(parts)!=3: continue
                  a,t,n=parts
                  try: addr=int(a,16)
                  except: continue
                  if t not in 'TtWwDdBbRrVv': continue
                  by_name.setdefault(n,[]).append(addr)
                  by_addr.setdefault(addr,[]).append(n)
              return by_name,by_addr
          def is_core_addr(a):
              return (0<=a<0x00100000 or 0x10000000<=a<0x10080000 or 0x20000000<=a<0x20040000)

          sn,sa=read_nm('stock_nm.txt'); mn,ma=read_nm('mod_nm.txt')
          shared=[]; drift=[]
          for name,saddrs in sn.items():
              maddrs=mn.get(name)
              if len(saddrs)!=1 or not maddrs or len(maddrs)!=1: continue
              x,y=saddrs[0],maddrs[0]
              if not is_core_addr(x): continue
              shared.append((name,x))
              if x!=y: drift.append((name,x,y))

          src=bytearray(Path('/tmp/in.ppma').read_bytes())
          mem,entry,hdr,ver=struct.unpack_from('<IIII',src,0)
          tag=bytes(src[76:80]); m4off=struct.unpack_from('<I',src,80)[0]
          patches=[]; same=[]; unresolved=[]; ambiguous=[]
          if m4off%4==0:
              for off in range(0,m4off,4):
                  val=struct.unpack_from('<I',src,off)[0]; thumb=val&1; base=val&~1
                  names=ma.get(base,[])
                  if not names or 0x10080000<=base<0x10090000: continue
                  candidates=[]; missing=[]
                  for name in names:
                      if name in sn: candidates.extend(sn[name])
                      else: missing.append(name)
                  candidates=sorted(set(candidates))
                  if len(candidates)==1:
                      newval=candidates[0]|thumb
                      if newval!=val:
                          patches.append((off,val,newval,names)); struct.pack_into('<I',src,off,newval)
                      elif is_core_addr(base): same.append((off,val,names))
                  elif len(candidates)>1: ambiguous.append((off,val,names,candidates))
                  elif missing and is_core_addr(base): unresolved.append((off,val,missing))

          body=src[:-4]
          if len(body)%4==0:
              total=sum(struct.unpack_from('<I',body,i)[0] for i in range(0,len(body),4))&0xffffffff
              struct.pack_into('<I',src,len(src)-4,(-total)&0xffffffff)
          final=sum(struct.unpack_from('<I',src,i)[0] for i in range(0,len(src),4))&0xffffffff if len(src)%4==0 else 1
          outdir=Path('hackrf/build_results/wifi_aim_full_n260808_fix7')
          out=outdir/'WiFiAIM_n260808_fix7.ppma'; out.write_bytes(src)
          sha=hashlib.sha256(src).hexdigest()
          report=[
            f'size={len(src)}',f'memory=0x{mem:08X}',f'entry=0x{entry:08X}',f'header={hdr}',
            f'version=0x{ver:08X}',f'tag={tag!r}',f'm4_offset={m4off}',
            f'shared_core_symbol_count={len(shared)}',f'core_symbol_drift_count={len(drift)}',
            f'patch_count={len(patches)}',f'resolved_same_core_reference_count={len(same)}',
            f'ambiguous_count={len(ambiguous)}',f'unresolved_count={len(unresolved)}',
            f'final_checksum=0x{final:08X}',
            'stock_operator_new='+','.join(hex(x) for x in sn.get('_Znwj',[])),
            'mod_operator_new='+','.join(hex(x) for x in mn.get('_Znwj',[])),
            'stock_to_string_mac_address='+','.join(hex(x) for x in sn.get(MACSYM,[])),
            'mod_to_string_mac_address='+','.join(hex(x) for x in mn.get(MACSYM,[])),
            'sha256='+sha]
          for x in drift[:100]: report.append('CORE_DRIFT '+repr(x))
          for x in patches[:100]: report.append('PATCH '+repr(x))
          for x in ambiguous[:50]: report.append('AMBIG '+repr(x))
          for x in unresolved[:50]: report.append('UNRES '+repr(x))
          ok=(len(src)<32768 and len(src)>=88 and hdr==3 and ver==EXPECTED_VERSION and tag==b'WAIM' and
              (entry&1)==1 and mem<=(entry&~1)<mem+m4off and 84<=m4off<len(src)-4 and m4off%4==0 and final==0 and
              len(shared)>0 and not drift and not patches and len(same)>0 and not unresolved and not ambiguous and
              sn.get('_Znwj')==[0x7ee24] and mn.get('_Znwj')==[0x7ee24] and not sn.get(MACSYM) and not mn.get(MACSYM))
          report.append('RESULT='+('PASS' if ok else 'FAIL'))
          (outdir/'VERIFY.txt').write_text('\n'.join(report)+'\n')
          (outdir/'SHA256SUMS.txt').write_text(f'{sha}  WiFiAIM_n260808_fix7.ppma\n')
          (outdir/'WiFiAIM_n260808_fix7.ppma.b64').write_text(base64.b64encode(src).decode())
          if not ok: raise SystemExit(2)
          PY
          cat "$OUT/VERIFY.txt"

      - name: Publish Fix7 result
        if: always()
        shell: bash
        run: |
          OUT=hackrf/build_results/wifi_aim_full_n260808_fix7
          mkdir -p "$OUT"
          if [ -f "$OUT/VERIFY.txt" ] && grep -q '^RESULT=PASS$' "$OUT/VERIFY.txt"; then
            printf 'WiFi AIM n_260808 fix7\nRESULT=PASS\nPurpose=Fix6 stock-compatible base plus pretrigger IQ, safer M4 init order, longer scan dwell and CAP/DEC diagnostics.\n' > "$OUT/STATUS.txt"
          else
            printf 'WiFi AIM n_260808 fix7\nRESULT=INCOMPLETE_OR_FAIL\nInspect BUILD.log and VERIFY.txt when present.\n' > "$OUT/STATUS.txt"
          fi
          git config user.name 'wifi-aim-builder'
          git config user.email 'actions@users.noreply.github.com'
          git add -f "$OUT" || true
          git commit -m 'Publish WiFi AIM n_260808 Fix7 diagnostics' || true
          git pull --rebase origin main || true
          git push origin HEAD:main || true

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wifi-aim-full-n260808-fix7
          path: hackrf/build_results/wifi_aim_full_n260808_fix7/*
          if-no-files-found: warn
