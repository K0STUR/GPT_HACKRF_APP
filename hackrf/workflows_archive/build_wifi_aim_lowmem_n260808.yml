name: Build WiFi AIM lowmem n_260808

on:
  push:
    paths:
      - '.github/workflows/build_wifi_aim_lowmem_n260808.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct WiFi AIM sources
        shell: bash
        run: |
          set -euo pipefail
          cat wifi_aim_n260808/src.part* > /tmp/wifi_aim_src.b64
          base64 -d /tmp/wifi_aim_src.b64 > /tmp/wifi_aim_src.tar.gz
          echo '294072ffe25e369fee1276cca11ea6a374fc27b2e09a081eb444eabd8eb01cb9  /tmp/wifi_aim_src.tar.gz' | sha256sum -c -
          mkdir -p wifi_src
          tar -xzf /tmp/wifi_aim_src.tar.gz -C wifi_src

          # Reduce M0 heap footprint substantially. Keep the 8 strongest/first AP slots for field testing.
          python3 - <<'PY'
          from pathlib import Path
          h=Path('wifi_src/firmware/application/external/wifi_aim/ui_wifi_aim.hpp')
          s=h.read_text()
          s=s.replace('static constexpr std::size_t kMaxAps = 32;', 'static constexpr std::size_t kMaxAps = 8;')
          s=s.replace('std::array<int16_t,16> target_levels_{};', 'std::array<int16_t,8> target_levels_{};')
          h.write_text(s)
          c=Path('wifi_src/firmware/application/external/wifi_aim/ui_wifi_aim.cpp')
          s=c.read_text()
          s=s.replace('target_levels_[(target_level_pos_+15)%16]', 'target_levels_[(target_level_pos_ + target_levels_.size() - 1) % target_levels_.size()]')
          c.write_text(s)
          PY

      - name: Checkout exact Mayhem nightly tag n_260808
        run: |
          git clone --recursive https://github.com/portapack-mayhem/mayhem-firmware.git mayhem
          cd mayhem
          git checkout nightly-tag-2026-08-08
          git submodule update --init --recursive
          test "$(git rev-parse HEAD)" = "367eaf54c0f51f62448d9f2d9585fd3629f6b770"

      - name: Integrate WiFi AIM
        shell: bash
        run: |
          set -euo pipefail
          cp -a wifi_src/firmware/application/external/wifi_aim mayhem/firmware/application/external/
          cp wifi_src/firmware/baseband/proc_wifi_aim.* mayhem/firmware/baseband/
          cp wifi_src/firmware/common/wifi_aim_wire.hpp mayhem/firmware/common/
          cp -a wifi_src/firmware/common/wifi_aim mayhem/firmware/common/
          python3 - <<'PY'
          from pathlib import Path
          p=Path('mayhem/firmware/application/external/external.cmake'); s=p.read_text()
          a='  external/signal_hunter/ui_signal_hunter.cpp'
          if 'external/wifi_aim/main.cpp' not in s:
              s=s.replace(a,a+'\n\n  #wifi_aim\n  external/wifi_aim/main.cpp\n  external/wifi_aim/ui_wifi_aim.cpp',1)
          la='  signal_hunter\n'
          if '\twifi_aim\n' not in s and '  wifi_aim\n' not in s: s=s.replace(la,la+'\twifi_aim\n',1)
          p.write_text(s)

          p=Path('mayhem/firmware/application/external/external.ld'); s=p.read_text()
          ma='    ram_external_app_tetra_rx              (rwx) : org = 0xAE0C0000, len = 32k'
          if 'ram_external_app_wifi_aim' not in s:
              s=s.replace(ma,ma+'\n    ram_external_app_wifi_aim              (rwx) : org = 0xAE0D0000, len = 32k',1)
          sa='} > ram_external_app_signal_hunter'
          if '.external_app_wifi_aim' not in s:
              block='''\n\n    .external_app_wifi_aim : ALIGN(4) SUBALIGN(4)\n    {\n        KEEP(*(.external_app.app_wifi_aim.application_information));\n        */external/wifi_aim/*(*ui*external_app*wifi_aim*);\n    } > ram_external_app_wifi_aim'''
              s=s.replace(sa,sa+block,1)
          p.write_text(s)

          p=Path('mayhem/firmware/tools/external_app_info.py'); s=p.read_text()
          for old in ['external_apps_address_end = 0xAE0B0000','external_apps_address_end = 0xAE0D0000']:
              s=s.replace(old,'external_apps_address_end = 0xAE0E0000')
          p.write_text(s)

          p=Path('mayhem/firmware/baseband/CMakeLists.txt'); s=p.read_text(); a='DeclareTargets(HUNT signal_hunter)'
          if 'DeclareTargets(WAIM wifi_aim)' not in s:
              s=s.replace(a,a+'''\n\n### WiFi AIM\nset(MODE_FLAGS "-Os")\nset(MODE_CPPSRC\n    proc_wifi_aim.cpp\n    ${COMMON}/wifi_aim/wifi_aim_phy.cpp\n)\nDeclareTargets(WAIM wifi_aim)\nset(MODE_FLAGS "-O3")''',1)
          p.write_text(s)
          PY

      - name: Build official Mayhem toolchain
        run: |
          cd mayhem
          docker build -t portapack-dev -f dockerfile-nogit .
          mkdir -p build
          docker run -e VERSION_STRING=n_260808 -i -v "$PWD":/havoc portapack-dev

      - name: Fix PPMA boundary and verify
        shell: bash
        run: |
          set -euo pipefail
          OUT=build_results/wifi_aim_lowmem_n260808
          rm -rf "$OUT"; mkdir -p "$OUT"
          cp mayhem/build/firmware/application/wifi_aim.ppma /tmp/in.ppma
          python3 - <<'PY'
          from pathlib import Path
          import struct, hashlib
          src=Path('/tmp/in.ppma').read_bytes()
          oldoff=struct.unpack_from('<I',src,80)[0]
          pad=(-oldoff)&3
          if pad:
              # export_external_apps.py pads the combined M0+M4 image at its tail.
              body=src[:-4]
              tail=body[-pad:]
              assert tail == bytes(pad), (pad,tail.hex())
              m0=body[:oldoff]
              m4=body[oldoff:-pad]
              d=bytearray(m0 + bytes(pad) + m4)
              struct.pack_into('<I',d,80,oldoff+pad)
              # Append checksum that makes 32-bit word sum exactly zero.
              assert len(d)%4==0
              total=sum(struct.unpack_from('<I',d,i)[0] for i in range(0,len(d),4)) & 0xffffffff
              d += struct.pack('<I',(-total)&0xffffffff)
          else:
              d=bytearray(src)
          newoff=struct.unpack_from('<I',d,80)[0]
          assert newoff%4==0
          assert len(d)%4==0
          assert sum(struct.unpack_from('<I',d,i)[0] for i in range(0,len(d),4)) & 0xffffffff == 0
          out=Path('build_results/wifi_aim_lowmem_n260808/WiFiAIM_n260808_lowmem.ppma')
          out.write_bytes(d)
          sha=hashlib.sha256(d).hexdigest()
          Path('build_results/wifi_aim_lowmem_n260808/VERIFY.txt').write_text(
              f'old_offset={oldoff}\npad={pad}\nnew_offset={newoff}\nsize={len(d)}\nsha256={sha}\nRESULT=PASS\n')
          Path('build_results/wifi_aim_lowmem_n260808/SHA256SUMS.txt').write_text(f'{sha}  {out}\n')
          import base64
          Path(str(out)+'.b64').write_text(base64.b64encode(d).decode())
          PY
          cp mayhem/build/firmware/baseband/WAIM.bin "$OUT/"
          cat "$OUT/VERIFY.txt"

      - name: Publish result
        shell: bash
        run: |
          git config user.name 'wifi-aim-builder'
          git config user.email 'actions@users.noreply.github.com'
          git add -f build_results/wifi_aim_lowmem_n260808
          git commit -m 'Publish WiFi AIM low-memory n_260808 build' || true
          git pull --rebase origin main || true
          git push origin HEAD:main || true
