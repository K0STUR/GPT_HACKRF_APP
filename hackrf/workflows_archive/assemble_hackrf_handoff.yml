name: Assemble HackRF handoff folder

on:
  push:
    paths:
      - '.github/workflows/assemble_hackrf_handoff.yml'
      - 'hackrf/HANDOFF_TRIGGER.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mirror HackRF project material into hackrf folder
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          mkdir -p hackrf/source_archive hackrf/build_results hackrf/workflows_archive hackrf/diagnostics

          # Preserve exact encoded source archive chunks used by existing CI builds.
          rm -rf hackrf/source_archive/*
          if [ -d wifi_aim_n260808 ]; then
            cp -a wifi_aim_n260808/. hackrf/source_archive/
          fi

          # Mirror every WiFi AIM build/result directory plus standalone diagnostics.
          rm -rf hackrf/build_results/* hackrf/diagnostics/*
          for d in build_results/wifi_aim*; do
            [ -e "$d" ] || continue
            cp -a "$d" hackrf/build_results/
          done
          for f in \
            build_results/PPMA_HEADER_INSPECT.txt \
            build_results/WIFI_AIM_FIRST_CALL.txt \
            build_results/ppma_diag_n260808.txt; do
            [ -f "$f" ] && cp -a "$f" hackrf/diagnostics/
          done

          # Mirror all project-specific workflows for reproducibility/history.
          rm -rf hackrf/workflows_archive/*
          for f in \
            .github/workflows/build_wifi_aim*.yml \
            .github/workflows/diag_wifi_aim*.yml \
            .github/workflows/diag_ppma*.yml \
            .github/workflows/inspect_ppma_header.yml \
            .github/workflows/patch_wifi_aim*.yml \
            .github/workflows/assemble_hackrf_handoff.yml; do
            [ -f "$f" ] && cp -a "$f" hackrf/workflows_archive/
          done

          {
            echo "HackRF handoff repository snapshot"
            echo "assembled_utc=$(date -u +%FT%TZ)"
            echo "source_commit=$(git rev-parse HEAD)"
            echo "source_branch=${GITHUB_REF_NAME}"
            echo
            echo "Mayhem target: n_260808"
            echo "Mayhem tag: nightly-tag-2026-08-08"
            echo "Mayhem commit: 367eaf54c0f51f62448d9f2d9585fd3629f6b770"
            echo
            echo "Mirrored build result directories:"
            find hackrf/build_results -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort
            echo
            echo "Mirrored workflow files:"
            find hackrf/workflows_archive -mindepth 1 -maxdepth 1 -type f -printf '%f\n' | sort
          } > hackrf/REPO_SNAPSHOT.txt

          # File-level hashes make a future chat able to detect stale/corrupt copies.
          find hackrf -type f ! -name MANIFEST_SHA256.txt -print0 | sort -z | xargs -0 sha256sum > hackrf/MANIFEST_SHA256.txt

      - name: Commit assembled handoff
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'hackrf-handoff-builder'
          git config user.email 'actions@users.noreply.github.com'
          git add -f hackrf
          git commit -m 'Assemble complete HackRF handoff snapshot' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
