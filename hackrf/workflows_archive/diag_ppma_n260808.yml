name: Diagnose WiFi AIM PPMA n_260808

on:
  push:
    paths:
      - '.github/workflows/diag_ppma_n260808.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Analyze PPMA files
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import struct, hashlib

          files = [
              Path('build_results/wifi_aim_probe_n260808/WiFiAimProbe_n260808.ppma'),
              Path('build_results/wifi_aim_full_n260808/WiFiAIM_n260808.ppma'),
          ]
          out=[]
          for p in files:
              b=p.read_bytes()
              out.append(f'FILE {p}')
              out.append(f'size={len(b)} sha256={hashlib.sha256(b).hexdigest()} mod4={len(b)%4}')
              if len(b) >= 84:
                  mem, entry, hdr, ver = struct.unpack_from('<IIII', b, 0)
                  name=b[16:32].split(b'\0',1)[0]
                  tag=b[76:80]
                  off=struct.unpack_from('<I', b, 80)[0]
                  m4sz=max(0,len(b)-off-4)
                  out.append(f'memory_location=0x{mem:08X}')
                  out.append(f'entry=0x{entry:08X}')
                  out.append(f'header={hdr} app_version=0x{ver:08X}')
                  out.append(f'name={name!r} tag={tag!r} m4_offset={off} m4_size={m4sz}')
                  out.append(f'expected_memory_location=0x{(0x10080000+m4sz):08X}')
                  out.append(f'entry_delta={entry-mem if entry>=mem else -(mem-entry)}')
              if len(b)%4==0:
                  words=struct.unpack('<%dI'%(len(b)//4),b)
                  s=sum(words)&0xffffffff
                  out.append(f'checksum32_all=0x{s:08X}')
                  out.append(f'final_word=0x{words[-1]:08X}')
              # simulate exact chunking of loader for m4 apps
              if len(b)>=84:
                  off=struct.unpack_from('<I',b,80)[0]
                  ranges=[]
                  i=0
                  while i<off:
                      n=min(512,off-i)
                      ranges.append((i,n))
                      i+=512
                  i=off
                  while i<len(b):
                      n=512
                      if i%512:
                          n=512-(i%512)
                      n=min(n,len(b)-i)
                      ranges.append((i,n))
                      if n==0: break
                      i+=n
                  covered=sum(n for _,n in ranges)
                  out.append(f'loader_ranges={len(ranges)} covered={covered} expected={len(b)} last={ranges[-3:]}')
                  # checksum exactly as simple_checksum over each read block
                  total=0
                  for st,n in ranges:
                      chunk=b[st:st+n]
                      for j in range(0,len(chunk),4):
                          q=chunk[j:j+4]+b'\0'*(4-len(chunk[j:j+4]))
                          total=(total+struct.unpack('<I',q)[0])&0xffffffff
                  out.append(f'loader_checksum=0x{total:08X}')
              out.append('')
          Path('build_results/ppma_diag_n260808.txt').write_text('\n'.join(out))
          print('\n'.join(out))
          PY
      - name: Publish diagnostics
        run: |
          git config user.name 'wifi-aim-builder'
          git config user.email 'actions@users.noreply.github.com'
          git add -f build_results/ppma_diag_n260808.txt
          git commit -m 'Publish PPMA loader diagnostics' || true
          git pull --rebase origin main || true
          git push origin HEAD:main || true
