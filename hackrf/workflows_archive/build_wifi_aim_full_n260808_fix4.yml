name: Build WiFi AIM n_260808 fix4 isolated

on:
  push:
    paths:
      - '.github/workflows/build_wifi_aim_full_n260808_fix4.yml'
      - 'trigger_wifi_aim_fix4.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare sources and Mayhem
        id: prep
        shell: bash
        run: |
          set +e
          OUT="$PWD/build_results/wifi_aim_full_n260808_fix4"
          rm -rf "$OUT" wifi_src mayhem
          mkdir -p "$OUT" wifi_src
          LOG="$OUT/BUILD_FULL.log"
          : > "$LOG"
          echo "started=$(date -u +%FT%TZ)" > "$OUT/STATUS.txt"

          cat wifi_aim_n260808/src.part* > /tmp/wifi_aim_src.b64
          base64 -d /tmp/wifi_aim_src.b64 > /tmp/wifi_aim_src.tar.gz
          echo '294072ffe25e369fee1276cca11ea6a374fc27b2e09a081eb444eabd8eb01cb9  /tmp/wifi_aim_src.tar.gz' | sha256sum -c - >>"$LOG" 2>&1
          rc=$?
          if [ "$rc" -eq 0 ]; then tar -xzf /tmp/wifi_aim_src.tar.gz -C wifi_src >>"$LOG" 2>&1; rc=$?; fi
          if [ "$rc" -eq 0 ]; then git clone --recursive https://github.com/portapack-mayhem/mayhem-firmware.git mayhem >>"$LOG" 2>&1; rc=$?; fi
          if [ "$rc" -eq 0 ]; then (cd mayhem && git checkout nightly-tag-2026-08-08 && git submodule update --init --recursive) >>"$LOG" 2>&1; rc=$?; fi
          echo "prep_rc=$rc" >> "$OUT/STATUS.txt"
          exit 0

      - name: Integrate isolated WiFi AIM
        if: always()
        shell: bash
        run: |
          set +e
          OUT="$PWD/build_results/wifi_aim_full_n260808_fix4"
          LOG="$OUT/BUILD_FULL.log"
          prep_rc=$(grep '^prep_rc=' "$OUT/STATUS.txt" | cut -d= -f2)
          rc=$prep_rc
          if [ "$rc" -eq 0 ]; then
            cp -a wifi_src/firmware/application/external/wifi_aim mayhem/firmware/application/external/ >>"$LOG" 2>&1 || rc=$?
            cp wifi_src/firmware/baseband/proc_wifi_aim.* mayhem/firmware/baseband/ >>"$LOG" 2>&1 || rc=$?
            cp wifi_src/firmware/common/wifi_aim_wire.hpp mayhem/firmware/common/ >>"$LOG" 2>&1 || rc=$?
            cp -a wifi_src/firmware/common/wifi_aim mayhem/firmware/common/ >>"$LOG" 2>&1 || rc=$?
          fi
          if [ "$rc" -eq 0 ]; then
          python3 - <<'PY' >>"$LOG" 2>&1
          from pathlib import Path
          p=Path('mayhem/firmware/application/external/external.cmake'); s=p.read_text()
          a='  external/signal_hunter/ui_signal_hunter.cpp'
          if 'external/wifi_aim/main.cpp' not in s: s=s.replace(a,a+'\n\n  #wifi_aim\n  external/wifi_aim/main.cpp\n  external/wifi_aim/ui_wifi_aim.cpp',1)
          la='  signal_hunter\n'
          if '\twifi_aim\n' not in s and '  wifi_aim\n' not in s: s=s.replace(la,la+'\twifi_aim\n',1)
          p.write_text(s)

          p=Path('mayhem/firmware/application/external/external.ld'); s=p.read_text()
          ma='    ram_external_app_tetra_rx              (rwx) : org = 0xAE0C0000, len = 32k'
          if 'ram_external_app_wifi_aim' not in s: s=s.replace(ma,ma+'\n    ram_external_app_wifi_aim              (rwx) : org = 0xAE0D0000, len = 32k',1)
          sa='} > ram_external_app_signal_hunter'
          if '.external_app_wifi_aim' not in s:
              block='''\n\n    .external_app_wifi_aim : ALIGN(4) SUBALIGN(4)\n    {\n        KEEP(*(.external_app.app_wifi_aim.application_information));\n        */external/wifi_aim/*(.text* .rodata* .data* .gnu.linkonce* .ARM.extab* .ARM.exidx*);\n        . = ALIGN(4);\n    } > ram_external_app_wifi_aim'''
              s=s.replace(sa,sa+block,1)
          p.write_text(s)

          p=Path('mayhem/firmware/tools/external_app_info.py'); s=p.read_text()
          s=s.replace('external_apps_address_end = 0xAE0B0000','external_apps_address_end = 0xAE0E0000')
          p.write_text(s)

          p=Path('mayhem/firmware/baseband/CMakeLists.txt'); s=p.read_text(); a='DeclareTargets(HUNT signal_hunter)'
          if 'DeclareTargets(WAIM wifi_aim)' not in s:
              s=s.replace(a,a+'''\n\n### WiFi AIM\nset(MODE_FLAGS "-Os")\nset(MODE_CPPSRC\n    proc_wifi_aim.cpp\n    ${COMMON}/wifi_aim/wifi_aim_phy.cpp\n)\nDeclareTargets(WAIM wifi_aim)\nset(MODE_FLAGS "-O3")''',1)
          p.write_text(s)
          PY
            rc=$?
          fi
          echo "integrate_rc=$rc" >> "$OUT/STATUS.txt"
          exit 0

      - name: Build Mayhem + WiFi AIM
        if: always()
        shell: bash
        run: |
          set +e
          OUT="$PWD/build_results/wifi_aim_full_n260808_fix4"
          LOG="$OUT/BUILD_FULL.log"
          rc=$(grep '^integrate_rc=' "$OUT/STATUS.txt" | cut -d= -f2)
          if [ "$rc" -eq 0 ]; then
            (cd mayhem && docker build -t portapack-dev -f dockerfile-nogit .) >>"$LOG" 2>&1
            rc=$?
          fi
          echo "docker_rc=$rc" >> "$OUT/STATUS.txt"
          if [ "$rc" -eq 0 ]; then
            mkdir -p mayhem/build
            (cd mayhem && docker run -e VERSION_STRING=n_260808 -i -v "$PWD":/havoc portapack-dev) >>"$LOG" 2>&1
            rc=$?
          fi
          echo "build_rc=$rc" >> "$OUT/STATUS.txt"
          exit 0

      - name: Verify and collect
        if: always()
        shell: bash
        run: |
          set +e
          OUT=build_results/wifi_aim_full_n260808_fix4
          PPMA=mayhem/build/firmware/application/wifi_aim.ppma
          M4=mayhem/build/firmware/baseband/WAIM.bin
          if [ -f "$PPMA" ]; then
            cp "$PPMA" "$OUT/WiFiAIM_n260808_fix4.ppma"
            [ -f "$M4" ] && cp "$M4" "$OUT/WAIM.bin"
            docker run --rm --entrypoint sh -v "$PWD/mayhem":/havoc portapack-dev -lc "arm-none-eabi-nm -n /havoc/build/firmware/application/application.elf | grep -E '(_Znwj|operator new)' | head -20" > "$OUT/CORE_SYMBOLS.txt" 2>/dev/null || true
            python3 - <<'PY' > "$OUT/VERIFY.txt"
          import struct,hashlib
          from pathlib import Path
          b=Path('build_results/wifi_aim_full_n260808_fix4/WiFiAIM_n260808_fix4.ppma').read_bytes()
          mem,entry,hdr,ver=struct.unpack_from('<IIII',b,0); tag=b[76:80]; off=struct.unpack_from('<I',b,80)[0]
          def csum(d):
              if len(d)%4:d+=b'\0'*(4-len(d)%4)
              return sum(struct.unpack('<%dI'%(len(d)//4),d))&0xffffffff
          total=0; i=0
          while i<off:
              n=min(512,off-i); ch=b[i:i+n]; total=(total+csum(ch))&0xffffffff
              if len(ch)<512: break
              i+=512
          i=off
          while True:
              n=512-(i%512) if i%512 else 512; ch=b[i:i+n]
              if not ch: break
              total=(total+csum(ch))&0xffffffff
              if len(ch)!=n: break
              i+=len(ch)
          core=Path('build_results/wifi_aim_full_n260808_fix4/CORE_SYMBOLS.txt').read_text(errors='ignore')
          stock_new=('0007ee24' in core.lower())
          print(f'size={len(b)}\nmemory=0x{mem:08X}\nentry=0x{entry:08X}\nheader={hdr}\nversion=0x{ver:08X}\ntag={tag!r}\nm4_offset={off}\nloader_checksum=0x{total:08X}\nstock_operator_new_match={stock_new}\nsha256={hashlib.sha256(b).hexdigest()}')
          ok=(hdr==3 and tag==b'WAIM' and off%4==0 and total==0 and (entry&1)==1 and stock_new)
          print('RESULT='+('PASS' if ok else 'FAIL'))
          PY
            sha256sum "$OUT/WiFiAIM_n260808_fix4.ppma" > "$OUT/SHA256SUMS.txt"
            base64 -w0 "$OUT/WiFiAIM_n260808_fix4.ppma" > "$OUT/WiFiAIM_n260808_fix4.ppma.b64"
          else
            echo 'RESULT=NO_PPMA' > "$OUT/VERIFY.txt"
          fi
          tail -n 1000 "$OUT/BUILD_FULL.log" > "$OUT/BUILD_TAIL.txt" 2>/dev/null || true
          echo "finished=$(date -u +%FT%TZ)" >> "$OUT/STATUS.txt"
          exit 0

      - name: Publish diagnostics/result
        if: always()
        shell: bash
        run: |
          git config user.name 'wifi-aim-builder'
          git config user.email 'actions@users.noreply.github.com'
          git add -f build_results/wifi_aim_full_n260808_fix4
          git commit -m 'Publish WiFi AIM n_260808 fix4 isolated build' || true
          git pull --rebase origin main || true
          git push origin HEAD:main || true
