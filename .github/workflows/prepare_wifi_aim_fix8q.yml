name: Prepare WiFi AIM Fix8q OFDM IQ conjugation

on:
  pull_request:
    paths:
      - 'hackrf/FIX8Q_PREP_TRIGGER.txt'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply Fix8q
        run: python3 hackrf/tools/apply_fix8q_ofdm_iq_conjugation.py

      - name: Validate Fix8q marker
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'Fix8q diagnostic: conjugate the CFO-corrected OFDM sample' hackrf/source_expanded/firmware/common/wifi_aim/wifi_aim_phy.cpp
          grep -q 'fft_\[n\].i=-(xr\*ri+xi\*rr);' hackrf/source_expanded/firmware/common/wifi_aim/wifi_aim_phy.cpp

      - name: Commit Fix8q source only
        shell: bash
        run: |
          set -euo pipefail
          rm -f hackrf/FIX8Q_PREP_TRIGGER.txt
          rm -f hackrf/tools/apply_fix8q_ofdm_iq_conjugation.py
          rm -f .github/workflows/prepare_wifi_aim_fix8q.yml
          git config user.name K0STUR
          git config user.email 74721566+K0STUR@users.noreply.github.com
          git add -A
          git commit -m 'WiFi AIM Fix8q: conjugate OFDM IQ after CFO correction'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
