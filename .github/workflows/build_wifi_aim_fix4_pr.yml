name: PR Build WiFi AIM fix4

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct sources
        run: |
          set -euo pipefail
          cat wifi_aim_n260808/src.part* > /tmp/wifi_aim_src.b64
          base64 -d /tmp/wifi_aim_src.b64 > /tmp/wifi_aim_src.tar.gz
          echo '294072ffe25e369fee1276cca11ea6a374fc27b2e09a081eb444eabd8eb01cb9  /tmp/wifi_aim_src.tar.gz' | sha256sum -c -
          mkdir wifi_src
          tar -xzf /tmp/wifi_aim_src.tar.gz -C wifi_src

      - name: Checkout Mayhem n_260808
        run: |
          git clone --recursive https://github.com/portapack-mayhem/mayhem-firmware.git mayhem
          cd mayhem
          git checkout nightly-tag-2026-08-08
          git submodule update --init --recursive
          test "$(git rev-parse HEAD)" = "367eaf54c0f51f62448d9f2d9585fd3629f6b770"

      - name: Integrate isolated WiFi AIM
        run: |
          set -euo pipefail
          cp -a wifi_src/firmware/application/external/wifi_aim mayhem/firmware/application/external/
          cp wifi_src/firmware/baseband/proc_wifi_aim.* mayhem/firmware/baseband/
          cp wifi_src/firmware/common/wifi_aim_wire.hpp mayhem/firmware/common/
          cp -a wifi_src/firmware/common/wifi_aim mayhem/firmware/common/
          python3 - <<'PY'
          from pathlib import Path
          p=Path('mayhem/firmware/application/external/external.cmake'); s=p.read_text()
          a='  external/signal_hunter/ui_signal_hunter.cpp'
          if 'external/wifi_aim/main.cpp' not in s: s=s.replace(a,a+'\n\n  #wifi_aim\n  external/wifi_aim/main.cpp\n  external/wifi_aim/ui_wifi_aim.cpp',1)
          la='  signal_hunter\n'
          if '\twifi_aim\n' not in s and '  wifi_aim\n' not in s: s=s.replace(la,la+'\twifi_aim\n',1)
          p.write_text(s)

          p=Path('mayhem/firmware/application/external/external.ld'); s=p.read_text()
          ma='    ram_external_app_tetra_rx              (rwx) : org = 0xAE0C0000, len = 32k'
          if 'ram_external_app_wifi_aim' not in s: s=s.replace(ma,ma+'\n    ram_external_app_wifi_aim              (rwx) : org = 0xAE0D0000, len = 32k',1)
          sa='} > ram_external_app_signal_hunter'
          if '.external_app_wifi_aim' not in s:
              block='''\n\n    .external_app_wifi_aim : ALIGN(4) SUBALIGN(4)\n    {\n        KEEP(*(.external_app.app_wifi_aim.application_information));\n        */external/wifi_aim/*(.text* .rodata* .data* .gnu.linkonce* .ARM.extab* .ARM.exidx*);\n        . = ALIGN(4);\n    } > ram_external_app_wifi_aim'''
              s=s.replace(sa,sa+block,1)
          p.write_text(s)

          p=Path('mayhem/firmware/tools/external_app_info.py'); s=p.read_text()
          s=s.replace('external_apps_address_end = 0xAE0B0000','external_apps_address_end = 0xAE0E0000')
          p.write_text(s)

          p=Path('mayhem/firmware/baseband/CMakeLists.txt'); s=p.read_text(); a='DeclareTargets(HUNT signal_hunter)'
          if 'DeclareTargets(WAIM wifi_aim)' not in s:
              s=s.replace(a,a+'''\n\n### WiFi AIM\nset(MODE_FLAGS "-Os")\nset(MODE_CPPSRC\n    proc_wifi_aim.cpp\n    ${COMMON}/wifi_aim/wifi_aim_phy.cpp\n)\nDeclareTargets(WAIM wifi_aim)\nset(MODE_FLAGS "-O3")''',1)
          p.write_text(s)
          PY

      - name: Build official Mayhem toolchain
        run: |
          cd mayhem
          docker build -t portapack-dev -f dockerfile-nogit .
          mkdir -p build
          docker run -e VERSION_STRING=n_260808 -i -v "$PWD":/havoc portapack-dev

      - name: Verify and package
        run: |
          set -euo pipefail
          OUT="$PWD/out"
          mkdir -p "$OUT"
          cp mayhem/build/firmware/application/wifi_aim.ppma "$OUT/WiFiAIM_n260808_fix4.ppma"
          cp mayhem/build/firmware/baseband/WAIM.bin "$OUT/WAIM.bin"
          docker run --rm --entrypoint sh -v "$PWD/mayhem":/havoc portapack-dev -lc "arm-none-eabi-nm -n /havoc/build/firmware/application/application.elf | grep -E '(_Znwj|operator new)' | head -20" > "$OUT/CORE_SYMBOLS.txt"
          python3 - <<'PY' > "$OUT/VERIFY.txt"
          import struct, hashlib
          from pathlib import Path
          b=Path('out/WiFiAIM_n260808_fix4.ppma').read_bytes()
          mem,entry,hdr,ver=struct.unpack_from('<IIII',b,0); tag=b[76:80]; off=struct.unpack_from('<I',b,80)[0]
          def csum(d):
              if len(d)%4: d += b'\0'*(4-len(d)%4)
              return sum(struct.unpack('<%dI'%(len(d)//4),d)) & 0xffffffff
          total=0; i=0
          while i<off:
              n=min(512,off-i); ch=b[i:i+n]; total=(total+csum(ch))&0xffffffff
              if len(ch)<512: break
              i+=512
          i=off
          while True:
              n=512-(i%512) if i%512 else 512; ch=b[i:i+n]
              if not ch: break
              total=(total+csum(ch))&0xffffffff
              if len(ch)!=n: break
              i+=len(ch)
          core=Path('out/CORE_SYMBOLS.txt').read_text(errors='ignore')
          stock_new=('0007ee24' in core.lower())
          sha=hashlib.sha256(b).hexdigest()
          print(f'size={len(b)}\nmemory=0x{mem:08X}\nentry=0x{entry:08X}\nheader={hdr}\nversion=0x{ver:08X}\ntag={tag!r}\nm4_offset={off}\nloader_checksum=0x{total:08X}\nstock_operator_new_match={stock_new}\nsha256={sha}')
          ok=(hdr==3 and tag==b'WAIM' and off%4==0 and total==0 and (entry&1)==1 and stock_new)
          print('RESULT='+('PASS' if ok else 'FAIL'))
          if not ok: raise SystemExit(2)
          PY
          sha256sum "$OUT/WiFiAIM_n260808_fix4.ppma" > "$OUT/SHA256SUMS.txt"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wifi-aim-fix4-n260808
          path: out/*
          if-no-files-found: error
