name: Prepare WiFi AIM Fix8e post-MAC diagnostics and throughput

on:
  pull_request:
    paths:
      - 'hackrf/FIX8E_PREP_TRIGGER.txt'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply Fix8e
        run: python3 hackrf/tools/apply_fix8e_postmac_perf.py

      - name: Run Fix8e post-DATA reference test
        run: python3 hackrf/tools/test_fix8e_post_pipeline.py

      - name: Validate Fix8e markers
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'post_stage{0}' hackrf/source_expanded/firmware/common/wifi_aim/wifi_aim_phy.hpp
          grep -q 'trace->stage >= 4u' hackrf/source_expanded/firmware/common/wifi_aim/wifi_aim_phy.hpp
          grep -q 'service_tail_zero' hackrf/source_expanded/firmware/common/wifi_aim/wifi_aim_phy.cpp
          grep -q 'ofdm_post_hits_' hackrf/source_expanded/firmware/baseband/proc_wifi_aim.cpp
          grep -q 'P S/F/G/B/I' hackrf/source_expanded/firmware/application/external/wifi_aim/ui_wifi_aim.cpp
          grep -q 'DS A/S' hackrf/source_expanded/firmware/application/external/wifi_aim/ui_wifi_aim.cpp
          grep -q 'update_ap_display();' hackrf/source_expanded/firmware/application/external/wifi_aim/ui_wifi_aim.cpp

      - name: Commit Fix8e sources
        shell: bash
        run: |
          set -euo pipefail
          rm -f hackrf/FIX8E_PREP_TRIGGER.txt
          git config user.name K0STUR
          git config user.email 74721566+K0STUR@users.noreply.github.com
          git add -A
          git commit -m 'WiFi AIM Fix8e: post-MAC diagnostics and DSSS throughput guard'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
