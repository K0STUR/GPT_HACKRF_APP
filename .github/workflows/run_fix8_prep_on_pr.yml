name: Run WiFi AIM Fix8 preparer on PR

on:
  pull_request:
    paths:
      - 'hackrf/FIX8_PR_TRIGGER.txt'
      - '.github/workflows/run_fix8_prep_on_pr.yml'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Extract and run Fix8 patcher
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          y=Path('.github/workflows/prepare_wifi_aim_fix8.yml').read_text().splitlines()
          start=None; end=None
          for i,line in enumerate(y):
              if "python3 - <<'PY'" in line:
                  start=i+1
                  continue
              if start is not None and line.strip()=='PY':
                  end=i
                  break
          assert start is not None and end is not None
          out=[]
          for line in y[start:end]:
              out.append(line[10:] if line.startswith('          ') else line)
          patch='\n'.join(out)+'\n'

          # The patcher was drafted against Fix7b. Current main already contains
          # Fix7c's update_done_status(), so adapt only the two UI anchors while
          # preserving Fix7c's exact final C/D refresh behavior.
          patch=patch.replace(
              "'    void update_scan_status();\\n    uint16_t scan_capture_delta() const;',\n              '    void update_scan_status();\\n    void update_phy_diag_display();\\n    uint8_t stage_delta(std::size_t i) const;\\n    uint16_t scan_capture_delta() const;'",
              "'    void update_scan_status();\\n    void update_done_status();\\nn    uint16_t scan_capture_delta() const;'.replace('\\n\\n','\\n'),\n              '    void update_scan_status();\\n    void update_done_status();\\n    void update_phy_diag_display();\\n    uint8_t stage_delta(std::size_t i) const;\\n    uint16_t scan_capture_delta() const;'"
          )

          old='''rep(uic,
              ''' + "'''" + '''    text_status.set(\"Done \" + to_string_dec_uint(ap_count_) + \"AP C\" +
                    to_string_dec_uint(scan_capture_delta()) + \" D\" +
                    to_string_dec_uint(scan_decode_delta()));
    update_ap_display();''' + "'''" + ''',
              ''' + "'''" + '''    text_status.set(\"Done \" + to_string_dec_uint(ap_count_) + \"AP C\" +
                    to_string_dec_uint(scan_capture_delta()) + \" D\" +
                    to_string_dec_uint(scan_decode_delta()) + \" M\" +
                    to_string_dec_uint(diag_ack_channel_));
    update_phy_diag_display();
    update_ap_display();''' + "'''" + ''')'''
          new='''rep(uic,
              ''' + "'''" + '''void WifiAimView::update_done_status() {
    if (scanning_ || target_set_) return;
    text_status.set(\"Done \" + to_string_dec_uint(ap_count_) + \"AP C\" +
                    to_string_dec_uint(scan_capture_delta()) + \" D\" +
                    to_string_dec_uint(scan_decode_delta()));
}''' + "'''" + ''',
              ''' + "'''" + '''void WifiAimView::update_done_status() {
    if (scanning_ || target_set_) return;
    text_status.set(\"Done \" + to_string_dec_uint(ap_count_) + \"AP C\" +
                    to_string_dec_uint(scan_capture_delta()) + \" D\" +
                    to_string_dec_uint(scan_decode_delta()) + \" M\" +
                    to_string_dec_uint(diag_ack_channel_));
    update_phy_diag_display();
}''' + "'''" + ''')'''
          if old not in patch:
              raise SystemExit('Fix7b end-scan patch block not found in extracted patcher')
          patch=patch.replace(old,new,1)

          # Correct the small header-anchor rewrite above explicitly; using a
          # direct literal keeps the generated patch readable and deterministic.
          patch=patch.replace("'    void update_scan_status();\\n    void update_done_status();\\nn    uint16_t scan_capture_delta() const;'.replace('\\n\\n','\\n')",
                              "'    void update_scan_status();\\n    void update_done_status();\\n    uint16_t scan_capture_delta() const;'")
          Path('/tmp/fix8_patch.py').write_text(patch)
          PY
          python3 /tmp/fix8_patch.py

      - name: Commit prepared Fix8 sources to PR branch
        shell: bash
        run: |
          set -euo pipefail
          rm -f hackrf/FIX8_PR_TRIGGER.txt hackrf/FIX8_PREP_TRIGGER.txt
          rm -f .github/workflows/prepare_wifi_aim_fix8.yml .github/workflows/run_fix8_prep_on_pr.yml
          git config user.name K0STUR
          git config user.email 74721566+K0STUR@users.noreply.github.com
          git add -A
          git commit -m 'WiFi AIM Fix8: add OFDM DSSS stage telemetry'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
