# migration trigger 2026-08-23
name: Migrate HackRF project from GPT

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/migrate_hackrf.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout destination
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone source repository
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/K0STUR/GPT.git /tmp/source

      - name: Copy HackRF / WiFi AIM project
        shell: bash
        run: |
          set -euo pipefail
          cp -a /tmp/source/hackrf ./
          [ -d /tmp/source/build_results ] && cp -a /tmp/source/build_results ./ || true
          [ -d /tmp/source/wifi_aim_n260808 ] && cp -a /tmp/source/wifi_aim_n260808 ./ || true
          [ -d /tmp/source/wifi_src_chunks ] && cp -a /tmp/source/wifi_src_chunks ./ || true
          [ -d /tmp/source/wifi_src_chunks8 ] && cp -a /tmp/source/wifi_src_chunks8 ./ || true

          for f in wifi_aim_buildsrc_min.zip wifi_aim_buildsrc_min.zip.b64 wifi_aim_mayhem_v0.4_arm_source.zip trigger_wifi_aim_fix4.txt trigger_wifi_aim_probe.txt; do
            [ -f "/tmp/source/$f" ] && cp -a "/tmp/source/$f" ./ || true
          done

          mkdir -p .github/workflows
          find /tmp/source/.github/workflows -maxdepth 1 -type f \( -iname '*hackrf*' -o -iname '*wifi_aim*' -o -iname '*ppma*' -o -iname '*veneer*' \) -print0 | xargs -0 -r -I{} cp -a {} .github/workflows/

          cat > README.md <<'EOF'
          # GPT_HACKRF_APP

          Development repository for the HackRF One + PortaPack Mayhem WiFi AIM application.

          Main project documentation and current state are in [`hackrf/`](hackrf/).

          This repository was split from `K0STUR/GPT` so HackRF/WiFi AIM development and GitHub Actions are isolated from the FORDstecki project.
          EOF

          rm -f MIGRATION_BOOTSTRAP.md MIGRATION_ACCESS_OK.txt MIGRATION_TEST.txt TEST.txt
          rm -f .github/workflows/migrate_from_gpt.yml .github/workflows/x.txt

      - name: Verify copied project
        shell: bash
        run: |
          set -euo pipefail
          test -d hackrf
          test -f hackrf/README.md
          test -f hackrf/PROJECT_STATUS.md
          test -f hackrf/TEST_LOG.md
          test -f .github/workflows/build_wifi_aim_full_n260808_fix7.yml
          echo 'Destination project verification: PASS'
          echo -n 'hackrf files: '
          find hackrf -type f | wc -l
          echo 'workflows:'
          find .github/workflows -maxdepth 1 -type f | sort

      - name: Commit migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No migration changes to commit.'
            exit 0
          fi
          git commit -m 'Migrate HackRF WiFi AIM project from K0STUR/GPT'
          git push
