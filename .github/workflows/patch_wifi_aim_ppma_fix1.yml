name: Patch WiFi AIM PPMA n_260808 fix1

on:
  push:
    paths:
      - '.github/workflows/patch_wifi_aim_ppma_fix1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Align M4 payload and rebuild checksum
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import struct, hashlib

          src=Path('build_results/wifi_aim_full_n260808/WiFiAIM_n260808.ppma')
          m4p=Path('build_results/wifi_aim_full_n260808/WAIM.bin')
          b=src.read_bytes()
          m4=m4p.read_bytes()
          old_off=struct.unpack_from('<I',b,80)[0]
          assert old_off==6493, old_off
          assert len(m4)%4==0, len(m4)
          assert b[old_off:old_off+len(m4)]==m4, 'embedded M4 does not match WAIM.bin'
          trailing=b[old_off+len(m4):-4]
          pad=(-old_off)&3
          assert pad==3, pad
          assert trailing==b'\0'*pad, trailing.hex()

          # Move exporter's 3 alignment bytes from after M4 to before M4.
          payload=bytearray(b[:old_off]) + bytearray(b'\0'*pad) + bytearray(m4)
          new_off=old_off+pad
          struct.pack_into('<I',payload,80,new_off)

          # Recompute Mayhem external-app additive checksum.
          assert len(payload)%4==0
          words=struct.unpack('<%dI'%(len(payload)//4),payload)
          s=sum(words)&0xffffffff
          checksum=(-s)&0xffffffff
          fixed=bytes(payload)+struct.pack('<I',checksum)
          assert len(fixed)==len(b)

          # Exact simulation of run_external_app() checksum chunking.
          ranges=[]
          i=0
          while i<new_off:
              n=min(512,new_off-i); ranges.append((i,n)); i+=512
          i=new_off
          while i<len(fixed):
              n=512-(i%512) if i%512 else 512
              n=min(n,len(fixed)-i)
              ranges.append((i,n)); i+=n
          total=0
          for st,n in ranges:
              c=fixed[st:st+n]
              for j in range(0,len(c),4):
                  q=c[j:j+4]+b'\0'*(4-len(c[j:j+4]))
                  total=(total+struct.unpack('<I',q)[0])&0xffffffff
          assert total==0, hex(total)
          assert new_off%4==0
          assert fixed[new_off:new_off+len(m4)]==m4

          out=Path('build_results/wifi_aim_full_n260808_fix1')
          out.mkdir(parents=True,exist_ok=True)
          dst=out/'WiFiAIM_n260808_fix1.ppma'
          dst.write_bytes(fixed)
          sha=hashlib.sha256(fixed).hexdigest()
          (out/'VERIFY.txt').write_text(
              f'old_offset={old_off}\nnew_offset={new_off}\n'
              f'm4_size={len(m4)}\nfile_size={len(fixed)}\n'
              f'loader_checksum=0x{total:08X}\nsha256={sha}\nRESULT=PASS\n')
          (out/'SHA256SUMS.txt').write_text(f'{sha}  {dst}\n')
          (out/'BUILD_STATUS.txt').write_text('RESULT=SUCCESS_PATCHED\n')
          import base64
          (out/'WiFiAIM_n260808_fix1.ppma.b64').write_text(base64.b64encode(fixed).decode())
          print((out/'VERIFY.txt').read_text())
          PY
      - name: Publish patched binary
        run: |
          git config user.name 'wifi-aim-builder'
          git config user.email 'actions@users.noreply.github.com'
          git add -f build_results/wifi_aim_full_n260808_fix1
          git commit -m 'Publish WiFi AIM n_260808 fix1 patched binary' || true
          git pull --rebase origin main || true
          git push origin HEAD:main || true
