name: One-time migrate HackRF project data from GPT

on:
  pull_request:
    paths:
      - 'MIGRATE_TRIGGER.txt'
      - '.github/workflows/migrate_from_gpt.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout destination main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Clone source repository
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/K0STUR/GPT.git /tmp/source

      - name: Copy HackRF and WiFi AIM project data only
        shell: bash
        run: |
          set -euo pipefail
          for p in \
            hackrf \
            build_results \
            wifi_aim_n260808 \
            wifi_src_chunks \
            wifi_src_chunks8 \
            wifi_aim_buildsrc_min.zip \
            wifi_aim_buildsrc_min.zip.b64 \
            wifi_aim_mayhem_v0.4_arm_source.zip \
            trigger_wifi_aim_fix4.txt \
            trigger_wifi_aim_probe.txt \
            AGENTS.md; do
            if [ -e "/tmp/source/$p" ]; then
              rm -rf "$p"
              cp -a "/tmp/source/$p" "$p"
            fi
          done
          rm -f MIGRATION_TEST.txt MIGRATION_ACCESS_OK.txt
          cat > README.md <<'EOF'
          # GPT_HACKRF_APP

          Development repository for the HackRF One + PortaPack Mayhem **WiFi AIM** application.

          This repository was split from `K0STUR/GPT` so the HackRF/PortaPack project and its GitHub Actions builds are isolated from FORDstecki.

          Start with:
          - `hackrf/README.md`
          - `hackrf/PROJECT_STATUS.md`
          - `hackrf/NEXT_CHAT_PROMPT.md`
          - `hackrf/TEST_LOG.md`

          Current target: stock PortaPack Mayhem `n_260808` (`nightly-tag-2026-08-08`, commit `367eaf54c0f51f62448d9f2d9585fd3629f6b770`).
          EOF
          test -d hackrf
          test ! -e FORDstecki
          git status --short

      - name: Commit migrated data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- . ':!.github/workflows'
          if git diff --cached --quiet; then
            echo 'No data changes to commit.'
            exit 0
          fi
          git commit -m 'Migrate HackRF WiFi AIM project data from K0STUR/GPT [skip ci]'
          git push origin HEAD:main
