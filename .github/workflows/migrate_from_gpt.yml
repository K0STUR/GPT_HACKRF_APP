name: One-time migrate HackRF project from GPT

on:
  pull_request:
    paths:
      - 'MIGRATE_TRIGGER.txt'
      - '.github/workflows/migrate_from_gpt.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout destination repository main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Clone source GPT repository
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/K0STUR/GPT.git /tmp/GPT_SOURCE

      - name: Replace destination contents with all non-FORDstecki non-workflow files
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' -exec rm -rf {} +
          mkdir -p .github/workflows
          find .github -mindepth 1 -maxdepth 1 ! -name 'workflows' -exec rm -rf {} +
          find .github/workflows -mindepth 1 -maxdepth 1 ! -name 'migrate_from_gpt.yml' -exec rm -rf {} +
          rsync -a \
            --exclude '.git' \
            --exclude 'FORDstecki' \
            --exclude '.github/workflows' \
            /tmp/GPT_SOURCE/ ./
          test -d hackrf
          test ! -e FORDstecki
          test -f .github/workflows/migrate_from_gpt.yml
          echo 'Top-level migrated content:'
          find . -mindepth 1 -maxdepth 2 -not -path './.git*' -print | sort

      - name: Commit migrated snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ChatGPT Migration'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git status --short
          git commit -m 'Migrate HackRF project data from K0STUR/GPT [skip ci]'
          git push origin HEAD:main
