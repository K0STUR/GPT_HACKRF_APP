name: WiFi AIM Offline PHY

on:
  push:
    branches:
      - wifi-aim-offline-phy-harness-v1
  pull_request:
    branches:
      - wifi-aim-fix8p-exact-service-ml2
  workflow_dispatch:

jobs:
  offline-phy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout WiFi AIM
        uses: actions/checkout@v4

      - name: Checkout independent IEEE 802.11 reference generator
        uses: actions/checkout@v4
        with:
          repository: cloud9477/gr-ieee80211
          path: reference_gr_ieee80211

      - name: Install Python dependencies
        run: |
          python3 -m pip install --user numpy matplotlib

      - name: Build exact baseline WiFi AIM PHY as host executable
        run: |
          mkdir -p build_offline
          g++ -std=c++17 -O2 -Wall -Wextra -Werror \
            -Ihackrf/source_expanded/firmware/common \
            hackrf/tools/wifi_aim_offline/host_decode.cpp \
            hackrf/source_expanded/firmware/common/wifi_aim/wifi_aim_phy.cpp \
            -o build_offline/wifi_aim_host_decode_baseline

      - name: Create corrected LTF timing candidate in workspace
        run: |
          mkdir -p build_offline/candidate
          cp hackrf/source_expanded/firmware/common/wifi_aim/wifi_aim_phy.cpp build_offline/candidate/wifi_aim_phy.cpp
          python3 - <<'PY'
          from pathlib import Path
          p=Path('build_offline/candidate/wifi_aim_phy.cpp')
          s=p.read_text()
          old='''    std::size_t best_d = best_end > kTimingBackoff ? best_end - kTimingBackoff : 0u;\n    if (best_d + 128u > count) return false;\n\n    float pr = 0.0f, pi = 0.0f;\n'''
          new='''    // Offline candidate: repetition gives a broad LTF region but not absolute\n    // 64-sample FFT phase. Refine it against the known time-domain LTF over a\n    // wide local window. kLtf itself is the 64-sample FFT interval, therefore\n    // the correlation maximum is used DIRECTLY; do not subtract the old\n    // repetition backoff again.\n    const std::size_t nominal_d = best_end > kTimingBackoff ? best_end - kTimingBackoff : 0u;\n    const std::size_t local_lo = nominal_d > 48u ? nominal_d - 48u : 0u;\n    const std::size_t local_hi = std::min<std::size_t>(nominal_d + 48u, count > 128u ? count - 128u : 0u);\n    float ref_e = 0.0f;\n    for (const auto& r : kLtf) ref_e += r.r*r.r + r.i*r.i;\n    float ref_best = -1.0f;\n    std::size_t best_d = nominal_d;\n    for (std::size_t d=local_lo; d<=local_hi; ++d) {\n        float cr=0.0f, ci=0.0f, ey=0.0f;\n        for (std::size_t n=0;n<64u;++n) {\n            const float yr=static_cast<float>(s[d+n].i), yi=static_cast<float>(s[d+n].q);\n            const float rr=kLtf[n].r, ri=kLtf[n].i;\n            cr += rr*yr + ri*yi;\n            ci += rr*yi - ri*yr;\n            ey += yr*yr + yi*yi;\n        }\n        if (ey <= 1.0f) continue;\n        const float q=(cr*cr+ci*ci)/(ref_e*ey);\n        if (q > ref_best) { ref_best=q; best_d=d; }\n    }\n    if (best_d + 128u > count) return false;\n    if (ref_best >= 0.0f) score = std::min(1.0f, ref_best);\n\n    float pr = 0.0f, pi = 0.0f;\n'''
          if old not in s:
              raise SystemExit('candidate patch anchor not found')
          p.write_text(s.replace(old,new,1))
          PY

      - name: Build corrected timing candidate
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror \
            -Ihackrf/source_expanded/firmware/common \
            hackrf/tools/wifi_aim_offline/host_decode.cpp \
            build_offline/candidate/wifi_aim_phy.cpp \
            -o build_offline/wifi_aim_host_decode_candidate

      - name: Run baseline against independent golden IQ
        run: |
          python3 hackrf/tools/wifi_aim_offline/reference_sweep.py \
            --decoder "$PWD/build_offline/wifi_aim_host_decode_baseline" \
            --reference-tools "$PWD/reference_gr_ieee80211/tools" \
            --out "$PWD/build_offline/baseline" \
            | tee build_offline/baseline.log

      - name: Run corrected timing candidate against same IQ
        run: |
          python3 hackrf/tools/wifi_aim_offline/reference_sweep.py \
            --decoder "$PWD/build_offline/wifi_aim_host_decode_candidate" \
            --reference-tools "$PWD/reference_gr_ieee80211/tools" \
            --out "$PWD/build_offline/candidate_results" \
            | tee build_offline/candidate.log

      - name: Compare summaries
        if: always()
        run: |
          echo '--- BASELINE ---'
          cat build_offline/baseline/summary.json || true
          echo '--- CANDIDATE ---'
          cat build_offline/candidate_results/summary.json || true
          echo '--- CANDIDATE CLEAN ROWS ---'
          grep '^clean_' build_offline/candidate_results/results.csv || true

      - name: Upload offline PHY evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wifi-aim-offline-phy-evidence
          path: |
            build_offline/baseline.log
            build_offline/candidate.log
            build_offline/baseline/*.json
            build_offline/baseline/*.csv
            build_offline/candidate_results/*.json
            build_offline/candidate_results/*.csv
          if-no-files-found: warn
