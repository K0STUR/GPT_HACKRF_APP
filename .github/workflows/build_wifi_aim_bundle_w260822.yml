name: Build WiFi AIM matched firmware bundle w_260822

on:
  push:
    paths:
      - '.github/workflows/build_wifi_aim_bundle_w260822.yml'
      - 'trigger_wifi_aim_bundle_w260822.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct WiFi AIM sources
        shell: bash
        run: |
          set -euo pipefail
          cat wifi_aim_n260808/src.part* > /tmp/wifi_aim_src.b64
          base64 -d /tmp/wifi_aim_src.b64 > /tmp/wifi_aim_src.tar.gz
          echo '294072ffe25e369fee1276cca11ea6a374fc27b2e09a081eb444eabd8eb01cb9  /tmp/wifi_aim_src.tar.gz' | sha256sum -c -
          rm -rf wifi_src
          mkdir -p wifi_src
          tar -xzf /tmp/wifi_aim_src.tar.gz -C wifi_src
          test -f wifi_src/firmware/application/external/wifi_aim/main.cpp
          test -f wifi_src/firmware/baseband/proc_wifi_aim.cpp
          test -f wifi_src/firmware/common/wifi_aim/wifi_aim_phy.cpp

      - name: Checkout exact Mayhem base
        shell: bash
        run: |
          set -euo pipefail
          git clone --recursive https://github.com/portapack-mayhem/mayhem-firmware.git mayhem
          cd mayhem
          git checkout nightly-tag-2026-08-08
          git submodule update --init --recursive
          test "$(git rev-parse HEAD)" = "367eaf54c0f51f62448d9f2d9585fd3629f6b770"

      - name: Integrate WiFi AIM
        shell: bash
        run: |
          set -euo pipefail
          cp -a wifi_src/firmware/application/external/wifi_aim mayhem/firmware/application/external/
          cp wifi_src/firmware/baseband/proc_wifi_aim.* mayhem/firmware/baseband/
          cp wifi_src/firmware/common/wifi_aim_wire.hpp mayhem/firmware/common/
          cp -a wifi_src/firmware/common/wifi_aim mayhem/firmware/common/

          python3 - <<'PY'
          from pathlib import Path

          p=Path('mayhem/firmware/application/external/external.cmake')
          s=p.read_text()
          a='  external/signal_hunter/ui_signal_hunter.cpp'
          if 'external/wifi_aim/main.cpp' not in s:
              assert a in s
              s=s.replace(a,a+'\n\n  # wifi_aim\n  external/wifi_aim/main.cpp\n  external/wifi_aim/ui_wifi_aim.cpp',1)
          la='  signal_hunter\n'
          if '\twifi_aim\n' not in s and '  wifi_aim\n' not in s:
              assert la in s
              s=s.replace(la,la+'\twifi_aim\n',1)
          p.write_text(s)

          p=Path('mayhem/firmware/application/external/external.ld')
          s=p.read_text()
          ma='    ram_external_app_tetra_rx              (rwx) : org = 0xAE0C0000, len = 32k'
          if 'ram_external_app_wifi_aim' not in s:
              assert ma in s
              s=s.replace(ma,ma+'\n    ram_external_app_wifi_aim              (rwx) : org = 0xAE0D0000, len = 32k',1)
          sa='} > ram_external_app_signal_hunter'
          if '.external_app_wifi_aim' not in s:
              assert sa in s
              block='''\n\n    .external_app_wifi_aim : ALIGN(4) SUBALIGN(4)\n    {\n        KEEP(*(.external_app.app_wifi_aim.application_information));\n        */external/wifi_aim/*(.text* .rodata* .data* .gnu.linkonce* .ARM.extab* .ARM.exidx*);\n        . = ALIGN(4);\n    } > ram_external_app_wifi_aim'''
              s=s.replace(sa,sa+block,1)
          p.write_text(s)

          p=Path('mayhem/firmware/tools/external_app_info.py')
          s=p.read_text()
          for old in ['external_apps_address_end = 0xAE0B0000','external_apps_address_end = 0xAE0D0000']:
              s=s.replace(old,'external_apps_address_end = 0xAE0E0000')
          p.write_text(s)

          p=Path('mayhem/firmware/baseband/CMakeLists.txt')
          s=p.read_text(); a='DeclareTargets(HUNT signal_hunter)'
          if 'DeclareTargets(WAIM wifi_aim)' not in s:
              assert a in s
              s=s.replace(a,a+'''\n\n### WiFi AIM\nset(MODE_FLAGS "-Os")\nset(MODE_CPPSRC\n    proc_wifi_aim.cpp\n    ${COMMON}/wifi_aim/wifi_aim_phy.cpp\n)\nDeclareTargets(WAIM wifi_aim)\nset(MODE_FLAGS "-O3")''',1)
          p.write_text(s)
          PY

      - name: Build matched custom firmware
        shell: bash
        run: |
          set -euo pipefail
          cd mayhem
          docker build -t portapack-dev -f dockerfile-nogit .
          mkdir -p build
          docker run -e VERSION_STRING=w_260822 -i -v "$PWD":/havoc portapack-dev

      - name: Verify WiFi AIM image and build SD bundle
        shell: bash
        run: |
          set -euo pipefail
          OUT=build_results/wifi_aim_bundle_w260822
          rm -rf "$OUT" /tmp/wifi_aim_sd
          mkdir -p "$OUT" /tmp/wifi_aim_sd/APPS /tmp/wifi_aim_sd/FIRMWARE

          PPMA=mayhem/build/firmware/application/wifi_aim.ppma
          FW=mayhem/build/firmware/portapack-mayhem-firmware.bin
          test -f "$PPMA"
          test -f "$FW"

          cp "$PPMA" "$OUT/WiFiAIM_w_260822.ppma"
          cp "$FW" "$OUT/portapack-mayhem_WIFI_AIM_w_260822.bin"
          cp mayhem/build/firmware/application/*.ppma /tmp/wifi_aim_sd/APPS/
          cp mayhem/build/firmware/standalone/*/*.ppmp /tmp/wifi_aim_sd/APPS/ 2>/dev/null || true
          cp "$FW" /tmp/wifi_aim_sd/FIRMWARE/portapack-mayhem_WIFI_AIM_w_260822.bin

          python3 - <<'PY' > "$OUT/VERIFY.txt"
          import struct,hashlib
          from pathlib import Path
          b=Path('build_results/wifi_aim_bundle_w260822/WiFiAIM_w_260822.ppma').read_bytes()
          mem,entry,hdr,ver=struct.unpack_from('<IIII',b,0)
          tag=b[76:80]; off=struct.unpack_from('<I',b,80)[0]
          def csum(d):
              if len(d)%4:d+=b'\0'*(4-len(d)%4)
              return sum(struct.unpack('<%dI'%(len(d)//4),d)) & 0xffffffff
          total=0; i=0
          while i<off:
              n=min(512,off-i); ch=b[i:i+n]; total=(total+csum(ch))&0xffffffff
              if len(ch)<512: break
              i+=512
          i=off
          while True:
              n=512-(i%512) if i%512 else 512
              ch=b[i:i+n]
              if not ch: break
              total=(total+csum(ch))&0xffffffff
              if len(ch)!=n: break
              i+=len(ch)
          ok=(hdr==3 and tag==b'WAIM' and off%4==0 and total==0 and (entry&1)==1)
          print(f'size={len(b)}')
          print(f'memory=0x{mem:08X}')
          print(f'entry=0x{entry:08X}')
          print(f'header={hdr}')
          print(f'version_md5=0x{ver:08X}')
          print(f'tag={tag!r}')
          print(f'm4_offset={off} mod4={off%4}')
          print(f'loader_checksum=0x{total:08X}')
          print('sha256='+hashlib.sha256(b).hexdigest())
          print('RESULT='+('PASS' if ok else 'FAIL'))
          if not ok: raise SystemExit(2)
          PY

          cat > /tmp/wifi_aim_sd/WIFI_AIM_README.txt <<'EOF'
          WiFi AIM test bundle - w_260822
          IMPORTANT: firmware and APPS in this bundle are a matched set.
          Back up the SD card before testing.
          Copy APPS from this bundle together with flashing the included firmware.
          Do not mix the WiFi AIM PPMA with stock n_260808 firmware.
          EOF

          (cd /tmp/wifi_aim_sd && zip -qr "$GITHUB_WORKSPACE/$OUT/COPY_TO_SDCARD_WIFI_AIM_w_260822.zip" .)
          sha256sum "$OUT/WiFiAIM_w_260822.ppma" "$OUT/portapack-mayhem_WIFI_AIM_w_260822.bin" "$OUT/COPY_TO_SDCARD_WIFI_AIM_w_260822.zip" > "$OUT/SHA256SUMS.txt"
          cp mayhem/build/firmware/baseband/WAIM.bin "$OUT/WAIM.bin"
          printf 'RESULT=SUCCESS\nVERSION=w_260822\n' > "$OUT/STATUS.txt"
          cat "$OUT/VERIFY.txt" >> "$OUT/STATUS.txt"

      - name: Publish matched test bundle
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'wifi-aim-builder'
          git config user.email 'actions@users.noreply.github.com'
          git add -f build_results/wifi_aim_bundle_w260822
          git commit -m 'Publish matched WiFi AIM w_260822 firmware bundle' || true
          git pull --rebase origin main || true
          git push origin HEAD:main || true

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: wifi-aim-w260822-matched-bundle
          path: build_results/wifi_aim_bundle_w260822/*
          if-no-files-found: error
