name: Prepare WiFi AIM Fix8p exact SERVICE ML2

on:
  pull_request:
    paths:
      - 'hackrf/FIX8P_PREP_TRIGGER.txt'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply Fix8p
        run: python3 hackrf/tools/apply_fix8p_exact_service_ml2.py

      - name: Validate SERVICE code geometry
        shell: bash
        run: |
          python3 - <<'PY'
          def cw(seed):
              st=seed
              bits=[(seed>>(6-i))&1 for i in range(7)]
              for _ in range(7,16):
                  fb=((st>>6)^(st>>3))&1
                  bits.append(fb)
                  st=((st<<1)&0x7e)|fb
              return sum(b<<i for i,b in enumerate(bits))
          codes=[cw(s) for s in range(1,128)]
          assert len(set(codes))==127
          dmin=min((a^b).bit_count() for i,a in enumerate(codes) for b in codes[i+1:])
          assert dmin==3, dmin
          for c in codes[:16]:
              assert min((c^x).bit_count() for x in codes)==0
              for bit in (0,5,15):
                  r=c^(1<<bit)
                  assert min((r^x).bit_count() for x in codes)==1
          print('FIX8P_SERVICE_GEOMETRY=PASS states=127 dmin=3 radius1_unique')
          PY

      - name: Validate Fix8p markers
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'exact nearest-codeword search across all 127' hackrf/source_expanded/firmware/common/wifi_aim/wifi_aim_phy.cpp
          grep -q 'candidate=1u;candidate<128u' hackrf/source_expanded/firmware/common/wifi_aim/wifi_aim_phy.cpp
          grep -q 'service_errors>2u' hackrf/source_expanded/firmware/common/wifi_aim/wifi_aim_phy.cpp
          grep -q 'exact nearest legal scrambler-sequence' hackrf/source_expanded/firmware/common/wifi_aim/wifi_aim_phy.hpp

      - name: Commit Fix8p sources
        shell: bash
        run: |
          set -euo pipefail
          rm -f hackrf/FIX8P_PREP_TRIGGER.txt
          rm -f hackrf/tools/apply_fix8p_exact_service_ml2.py
          rm -f .github/workflows/prepare_wifi_aim_fix8p.yml
          git config user.name K0STUR
          git config user.email 74721566+K0STUR@users.noreply.github.com
          git add -A
          git commit -m 'WiFi AIM Fix8p: exact SERVICE distance and ML2 admission'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
