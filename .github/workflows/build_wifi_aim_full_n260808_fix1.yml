name: Build WiFi AIM n_260808 fix1

on:
  push:
    paths:
      - '.github/workflows/build_wifi_aim_full_n260808_fix1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct WiFi AIM sources
        shell: bash
        run: |
          set -euo pipefail
          cat wifi_aim_n260808/src.part* > /tmp/wifi_aim_src.b64
          base64 -d /tmp/wifi_aim_src.b64 > /tmp/wifi_aim_src.tar.gz
          echo '294072ffe25e369fee1276cca11ea6a374fc27b2e09a081eb444eabd8eb01cb9  /tmp/wifi_aim_src.tar.gz' | sha256sum -c -
          mkdir -p wifi_src
          tar -xzf /tmp/wifi_aim_src.tar.gz -C wifi_src

      - name: Checkout Mayhem snapshot for n_260808
        run: |
          git clone --recursive https://github.com/portapack-mayhem/mayhem-firmware.git mayhem
          cd mayhem
          git checkout 367eaf54c0f51f62448d9f2d9585fd3629f6b770
          git submodule update --init --recursive

      - name: Integrate WiFi AIM with aligned M0 section
        shell: bash
        run: |
          set -euo pipefail
          cp -a wifi_src/firmware/application/external/wifi_aim mayhem/firmware/application/external/
          cp wifi_src/firmware/baseband/proc_wifi_aim.* mayhem/firmware/baseband/
          cp wifi_src/firmware/common/wifi_aim_wire.hpp mayhem/firmware/common/
          cp -a wifi_src/firmware/common/wifi_aim mayhem/firmware/common/

          python3 - <<'PY'
          from pathlib import Path

          p=Path('mayhem/firmware/application/external/external.cmake')
          s=p.read_text()
          a='  external/signal_hunter/ui_signal_hunter.cpp'
          s=s.replace(a,a+'\n\n  #wifi_aim\n  external/wifi_aim/main.cpp\n  external/wifi_aim/ui_wifi_aim.cpp',1)
          s=s.replace('  signal_hunter\n','  signal_hunter\n\twifi_aim\n',1)
          p.write_text(s)

          p=Path('mayhem/firmware/application/external/external.ld')
          s=p.read_text()
          a='    ram_external_app_tetra_rx              (rwx) : org = 0xAE0C0000, len = 32k'
          s=s.replace(a,a+'\n    ram_external_app_wifi_aim              (rwx) : org = 0xAE0D0000, len = 32k',1)
          a='} > ram_external_app_signal_hunter'
          block='''\n\n    .external_app_wifi_aim : ALIGN(4) SUBALIGN(4)\n    {\n        KEEP(*(.external_app.app_wifi_aim.application_information));\n        */external/wifi_aim/*(*ui*external_app*wifi_aim*);\n        . = ALIGN(4);\n    } > ram_external_app_wifi_aim'''
          s=s.replace(a,a+block,1)
          p.write_text(s)

          p=Path('mayhem/firmware/tools/external_app_info.py')
          s=p.read_text().replace('external_apps_address_end = 0xAE0B0000','external_apps_address_end = 0xAE0E0000')
          p.write_text(s)

          p=Path('mayhem/firmware/baseband/CMakeLists.txt')
          s=p.read_text()
          a='DeclareTargets(HUNT signal_hunter)'
          block='''\n\n### WiFi AIM\nset(MODE_FLAGS "-Os")\nset(MODE_CPPSRC\n    proc_wifi_aim.cpp\n    ${COMMON}/wifi_aim/wifi_aim_phy.cpp\n)\nDeclareTargets(WAIM wifi_aim)\nset(MODE_FLAGS "-O3")'''
          s=s.replace(a,a+block,1)
          p.write_text(s)
          PY

      - name: Build official Mayhem toolchain image
        run: |
          cd mayhem
          docker build -t portapack-dev -f dockerfile-nogit .

      - name: Full build n_260808
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p mayhem/build
          cd mayhem
          docker run -e VERSION_STRING=n_260808 -i -v "$PWD":/havoc portapack-dev

      - name: Verify PPMA exactly like loader
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import struct, hashlib
          p=Path('mayhem/build/firmware/application/wifi_aim.ppma')
          b=p.read_bytes()
          mem,entry,hdr,ver=struct.unpack_from('<IIII',b,0)
          off=struct.unpack_from('<I',b,80)[0]
          tag=b[76:80]
          ranges=[]
          i=0
          while i<off:
              n=min(512,off-i); ranges.append((i,n)); i+=512
          i=off
          while i<len(b):
              n=512-(i%512) if i%512 else 512
              n=min(n,len(b)-i)
              ranges.append((i,n)); i+=n
          total=0
          for st,n in ranges:
              c=b[st:st+n]
              for j in range(0,len(c),4):
                  q=c[j:j+4]+b'\0'*(4-len(c[j:j+4]))
                  total=(total+struct.unpack('<I',q)[0])&0xffffffff
          txt=(
              f'size={len(b)}\nsha256={hashlib.sha256(b).hexdigest()}\n'
              f'memory_location=0x{mem:08X}\nentry=0x{entry:08X}\nheader={hdr}\n'
              f'app_version=0x{ver:08X}\ntag={tag.decode(errors="replace")}\n'
              f'm4_offset={off}\nm4_offset_mod4={off%4}\nloader_checksum=0x{total:08X}\n'
          )
          print(txt)
          Path('/tmp/verify.txt').write_text(txt)
          assert off%4==0, 'M4 offset is not 4-byte aligned'
          assert total==0, 'Loader checksum would fail on PortaPack'
          assert tag==b'WAIM'
          PY

      - name: Publish fixed build
        shell: bash
        run: |
          set -euo pipefail
          OUT=build_results/wifi_aim_full_n260808_fix1
          rm -rf "$OUT" && mkdir -p "$OUT"
          cp mayhem/build/firmware/application/wifi_aim.ppma "$OUT/WiFiAIM_n260808_fix1.ppma"
          cp /tmp/verify.txt "$OUT/VERIFY.txt"
          sha256sum "$OUT/WiFiAIM_n260808_fix1.ppma" > "$OUT/SHA256SUMS.txt"
          base64 -w0 "$OUT/WiFiAIM_n260808_fix1.ppma" > "$OUT/WiFiAIM_n260808_fix1.ppma.b64"
          printf 'RESULT=SUCCESS\n' > "$OUT/BUILD_STATUS.txt"
          git config user.name 'wifi-aim-builder'
          git config user.email 'actions@users.noreply.github.com'
          git add -f "$OUT"
          git commit -m 'Publish WiFi AIM n_260808 fix1' || true
          git pull --rebase origin main || true
          git push origin HEAD:main || true
