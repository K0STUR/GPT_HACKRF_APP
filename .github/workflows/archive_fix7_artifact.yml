name: Archive migrated Fix7 artifact

on:
  push:
    paths:
      - '.github/workflows/archive_fix7_artifact.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and archive original Fix7 artifact
        shell: bash
        env:
          ARTIFACT_URL: "https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-54e8-8210-94d8-3d2814be5aad/raw?se=2026-08-23T22%3A07%3A58Z&sp=r&sv=2026-02-06&sr=b&scid=3a89e542-cc16-5eba-9bf0-e92b81ed2ee2&skoid=9b41a688-1b44-4731-856e-b0efcf3660ed&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-23T09%3A39%3A20Z&ske=2026-08-24T09%3A39%3A20Z&sks=b&skv=2026-02-06&sig=3kvFmEHWDapMwNJKEqyTHoHzGokgxgg529tvnrWCYOM%3D"
        run: |
          set -euo pipefail
          dst='hackrf/build_results/wifi_aim_full_n260808_fix7'
          rm -rf "$dst"
          mkdir -p "$dst"
          curl -fL --retry 3 "$ARTIFACT_URL" -o "$dst/wifi-aim-full-n260808-fix7.zip"
          echo '069443da8de1a270d1b3fd60766034b5643489bb5531dff83a74c03a5629a33d  wifi-aim-full-n260808-fix7.zip' > "$dst/ARTIFACT_SHA256.txt"
          (cd "$dst" && sha256sum -c ARTIFACT_SHA256.txt)
          unzip -o "$dst/wifi-aim-full-n260808-fix7.zip" -d "$dst"
          test -f "$dst/WiFiAIM_n260808_fix7.ppma"
          test -f "$dst/WAIM.bin"
          test -f "$dst/BUILD.log"
          grep -q '^RESULT=FAIL$' "$dst/VERIFY.txt"
          grep -q '^core_symbol_drift_count=179$' "$dst/VERIFY.txt"

      - name: Commit complete Fix7 archive and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/archive_fix7_artifact.yml
          git config user.name 'hackrf-migration'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Archive complete Fix7 CI artifact after repository split'
          git push
