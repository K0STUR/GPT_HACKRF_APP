name: Expand WiFi AIM source snapshot

on:
  push:
    paths:
      - '.github/workflows/expand_wifi_aim_source.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct source archive
        shell: bash
        run: |
          set -euo pipefail
          cat wifi_aim_n260808/src.part* > /tmp/wifi_aim_src.b64
          base64 -d /tmp/wifi_aim_src.b64 > /tmp/wifi_aim_src.tar.gz
          echo '294072ffe25e369fee1276cca11ea6a374fc27b2e09a081eb444eabd8eb01cb9  /tmp/wifi_aim_src.tar.gz' | sha256sum -c -
          rm -rf /tmp/wifi_src hackrf/source_expanded
          mkdir -p /tmp/wifi_src hackrf/source_expanded
          tar -xzf /tmp/wifi_aim_src.tar.gz -C /tmp/wifi_src
          cp -a /tmp/wifi_src/. hackrf/source_expanded/
          find hackrf/source_expanded -type f -print | sort > hackrf/source_expanded/SOURCE_TREE.txt

      - name: Publish expanded source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hackrf/source_expanded
          if git diff --cached --quiet; then
            echo 'No changes to publish'
            exit 0
          fi
          git commit -m 'Expand WiFi AIM source snapshot for decoder diagnostics'
          git push
