name: Prepare WiFi AIM Fix8c LTF synchronizer

on:
  pull_request:
    paths:
      - 'hackrf/FIX8C_PREP_TRIGGER.txt'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply Fix8c LTF synchronizer
        run: python3 hackrf/tools/apply_fix8c_ltf_sync.py

      - name: Validate Fix8c markers
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'kSyncThreshold = 0.15f' hackrf/source_expanded/firmware/common/wifi_aim/wifi_aim_phy.cpp
          grep -q 'metric = q64 \* (1.0f - q16)' hackrf/source_expanded/firmware/common/wifi_aim/wifi_aim_phy.cpp
          grep -q 'SQ ' hackrf/source_expanded/firmware/application/external/wifi_aim/ui_wifi_aim.cpp

      - name: Commit Fix8c sources
        shell: bash
        run: |
          set -euo pipefail
          rm -f hackrf/FIX8C_PREP_TRIGGER.txt
          git config user.name K0STUR
          git config user.email 74721566+K0STUR@users.noreply.github.com
          git add -A
          git commit -m 'WiFi AIM Fix8c: repetition-based LTF synchronization'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
