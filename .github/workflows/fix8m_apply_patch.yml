name: Fix8m one-shot SERVICE-distance telemetry patch

on:
  push:
    branches:
      - wifi-aim-fix8m-service-distance

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wifi-aim-fix8m-service-distance
          fetch-depth: 0

      - name: Apply Fix8m SERVICE-distance telemetry
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def read_lines(path):
              return Path(path), Path(path).read_text().splitlines()
          def one_index(lines, needle, label):
              hits=[i for i,x in enumerate(lines) if needle in x]
              if len(hits)!=1:
                  raise SystemExit(f'{label}: {needle!r} hits={len(hits)}; nearby='+repr([x for x in lines if needle.split()[0] in x][:8]))
              return hits[0]
          def write(p, lines):
              p.write_text('\n'.join(lines)+'\n')

          # 1) M4 trace field.
          p, lines=read_lines('hackrf/source_expanded/firmware/common/wifi_aim/wifi_aim_phy.hpp')
          if not any('service_errors' in x for x in lines):
              i=one_index(lines,'uint8_t frame_type','trace frame_type')
              indent=lines[i][:len(lines[i])-len(lines[i].lstrip())]
              lines[i:i]=[
                  indent+'// Fix8m: Hamming distance of known-zero SERVICE bits 7..15.',
                  indent+'uint8_t service_errors{0xFFu};']
              write(p,lines)
              print('trace field applied')

          # 2) Exact same SERVICE accept/reject criterion, with distance exported.
          p, lines=read_lines('hackrf/source_expanded/firmware/common/wifi_aim/wifi_aim_phy.cpp')
          if not any('trace->service_errors' in x for x in lines):
              i=one_index(lines,'bool service_tail_zero','service declaration')
              indent=lines[i][:len(lines[i])-len(lines[i].lstrip())]
              lines[i]=indent+'uint8_t service_errors = 0u;'
              i=one_index(lines,'service_tail_zero = false','service counter')
              indent=lines[i][:len(lines[i])-len(lines[i].lstrip())]
              lines[i]=indent+'if (i < 16u && bit) ++service_errors;'
              i=one_index(lines,'if (!service_tail_zero) return false;','service reject')
              indent=lines[i][:len(lines[i])-len(lines[i].lstrip())]
              lines[i:i+1]=[
                  indent+'if (trace) trace->service_errors = service_errors;',
                  indent+'if (service_errors != 0u) return false;']
              write(p,lines)
              print('decoder distance applied')

          # 3) Processor state: pin FC once SERVICE-distance telemetry exists.
          p, lines=read_lines('hackrf/source_expanded/firmware/baseband/proc_wifi_aim.hpp')
          if not any('ofdm_service_seen_' in x for x in lines):
              i=one_index(lines,'uint8_t ofdm_last_subtype_','service state anchor')
              indent=lines[i][:len(lines[i])-len(lines[i].lstrip())]
              lines.insert(i+1,indent+'bool ofdm_service_seen_{false};')
              write(p,lines)
              print('processor state applied')

          p, lines=read_lines('hackrf/source_expanded/firmware/baseband/proc_wifi_aim.cpp')
          if not any('ofdm_service_seen_ = false' in x for x in lines):
              hits=[i for i,x in enumerate(lines) if 'ofdm_last_subtype_ = 0xFFu' in x]
              if len(hits)!=1: raise SystemExit(f'reset anchor hits={len(hits)}')
              i=hits[0]; indent=lines[i][:len(lines[i])-len(lines[i].lstrip())]
              lines.insert(i+1,indent+'ofdm_service_seen_ = false;')

          if not any('Fix8m: after DATA Viterbi' in x for x in lines):
              a=[i for i,x in enumerate(lines) if 'if (ofdm_trace.frame_type !=' in x]
              b=[i for i,x in enumerate(lines) if 'if (ofdm_trace.frame_subtype !=' in x]
              if len(a)!=1 or len(b)!=1 or b[0]!=a[0]+1:
                  raise SystemExit(f'FC anchors type={a} subtype={b}')
              i=a[0]; indent=lines[i][:len(lines[i])-len(lines[i].lstrip())]
              block=[
                  indent+'// Fix8m: after DATA Viterbi, FC is min SERVICE errors / raw RATE.',
                  indent+'// Before first DATA candidate, retain older DSSS FC diagnostics.',
                  indent+'if (ofdm_trace.stage >= 7u && ofdm_trace.service_errors != 0xFFu) {',
                  indent+'    if (!ofdm_service_seen_ || ofdm_trace.service_errors < ofdm_last_type_) {',
                  indent+'        ofdm_last_type_ = ofdm_trace.service_errors;',
                  indent+'        ofdm_last_subtype_ = ofdm_trace.rate_raw;',
                  indent+'    }',
                  indent+'    ofdm_service_seen_ = true;',
                  indent+'} else if (!ofdm_service_seen_) {',
                  indent+'    if (ofdm_trace.frame_type != 0xFFu) ofdm_last_type_ = ofdm_trace.frame_type;',
                  indent+'    if (ofdm_trace.frame_subtype != 0xFFu) ofdm_last_subtype_ = ofdm_trace.frame_subtype;',
                  indent+'}']
              lines[i:i+2]=block
          write(p,lines)
          print('processor telemetry applied')
          print('Fix8m source patch complete')
          PY

      - name: Commit Fix8m source changes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- \
              hackrf/source_expanded/firmware/common/wifi_aim/wifi_aim_phy.hpp \
              hackrf/source_expanded/firmware/common/wifi_aim/wifi_aim_phy.cpp \
              hackrf/source_expanded/firmware/baseband/proc_wifi_aim.hpp \
              hackrf/source_expanded/firmware/baseband/proc_wifi_aim.cpp; then
            echo 'No source change to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
              hackrf/source_expanded/firmware/common/wifi_aim/wifi_aim_phy.hpp \
              hackrf/source_expanded/firmware/common/wifi_aim/wifi_aim_phy.cpp \
              hackrf/source_expanded/firmware/baseband/proc_wifi_aim.hpp \
              hackrf/source_expanded/firmware/baseband/proc_wifi_aim.cpp
          git commit -m 'Fix8m: measure SERVICE distance on DATA candidates'
          git push origin HEAD:wifi-aim-fix8m-service-distance
