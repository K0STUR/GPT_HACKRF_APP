name: Fix8m one-shot SERVICE-distance telemetry patch

on:
  push:
    branches:
      - wifi-aim-fix8m-service-distance

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wifi-aim-fix8m-service-distance
          fetch-depth: 0

      - name: Apply Fix8m SERVICE-distance telemetry
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p=Path(path); s=p.read_text()
              if new in s and old not in s:
                  print(label, 'already applied'); return
              n=s.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected 1 anchor, found {n}')
              p.write_text(s.replace(old,new,1))
              print(label, 'applied')

          # Internal M4-only trace field. Insert immediately before frame_type;
          # matching one line avoids whitespace/comment fragility.
          replace_once(
              'hackrf/source_expanded/firmware/common/wifi_aim/wifi_aim_phy.hpp',
              '    uint8_t frame_type{0xFFu};',
              '    // Fix8m: Hamming distance of known-zero SERVICE bits 7..15.\n'
              '    uint8_t service_errors{0xFFu};\n'
              '    uint8_t frame_type{0xFFu};',
              'trace field')

          # Keep acceptance semantics exactly the same, but count the nine
          # checkable SERVICE bits and expose the distance before rejecting.
          replace_once(
              'hackrf/source_expanded/firmware/common/wifi_aim/wifi_aim_phy.cpp',
              '    bool service_tail_zero = true;',
              '    uint8_t service_errors = 0u;',
              'service declaration')
          replace_once(
              'hackrf/source_expanded/firmware/common/wifi_aim/wifi_aim_phy.cpp',
              '        if (i < 16u && bit) service_tail_zero = false;',
              '        if (i < 16u && bit) ++service_errors;',
              'service counter')
          replace_once(
              'hackrf/source_expanded/firmware/common/wifi_aim/wifi_aim_phy.cpp',
              '    if (!service_tail_zero) return false;',
              '    if (trace) trace->service_errors = service_errors;\n'
              '    if (service_errors != 0u) return false;',
              'service export')

          # Dedicated scan-state flag so DSSS FC diagnostics cannot overwrite
          # a SERVICE-distance result and vice versa.
          replace_once(
              'hackrf/source_expanded/firmware/baseband/proc_wifi_aim.hpp',
              '    uint8_t ofdm_last_subtype_{0xFF};',
              '    uint8_t ofdm_last_subtype_{0xFF};\n'
              '    bool ofdm_service_seen_{false};',
              'processor state')

          replace_once(
              'hackrf/source_expanded/firmware/baseband/proc_wifi_aim.cpp',
              '    ofdm_last_subtype_ = 0xFFu;\n    dsss_attempts_ = 0;',
              '    ofdm_last_subtype_ = 0xFFu;\n'
              '    ofdm_service_seen_ = false;\n'
              '    dsss_attempts_ = 0;',
              'processor reset')

          old='''    if (ofdm_trace.frame_type != 0xFFu) ofdm_last_type_ = ofdm_trace.frame_type;\n    if (ofdm_trace.frame_subtype != 0xFFu) ofdm_last_subtype_ = ofdm_trace.frame_subtype;'''
          new='''    // Fix8m: after DATA Viterbi, FC is min SERVICE errors / raw RATE.\n    // Before the first DATA candidate, preserve the existing DSSS FC diagnostics.\n    if (ofdm_trace.stage >= 7u && ofdm_trace.service_errors != 0xFFu) {\n        if (!ofdm_service_seen_ || ofdm_trace.service_errors < ofdm_last_type_) {\n            ofdm_last_type_ = ofdm_trace.service_errors;\n            ofdm_last_subtype_ = ofdm_trace.rate_raw;\n        }\n        ofdm_service_seen_ = true;\n    } else if (!ofdm_service_seen_) {\n        if (ofdm_trace.frame_type != 0xFFu) ofdm_last_type_ = ofdm_trace.frame_type;\n        if (ofdm_trace.frame_subtype != 0xFFu) ofdm_last_subtype_ = ofdm_trace.frame_subtype;\n    }'''
          replace_once(
              'hackrf/source_expanded/firmware/baseband/proc_wifi_aim.cpp',
              old,new,'processor FC telemetry')

          print('Fix8m source patch complete')
          PY

      - name: Commit Fix8m source changes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- \
              hackrf/source_expanded/firmware/common/wifi_aim/wifi_aim_phy.hpp \
              hackrf/source_expanded/firmware/common/wifi_aim/wifi_aim_phy.cpp \
              hackrf/source_expanded/firmware/baseband/proc_wifi_aim.hpp \
              hackrf/source_expanded/firmware/baseband/proc_wifi_aim.cpp; then
            echo 'No source change to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
              hackrf/source_expanded/firmware/common/wifi_aim/wifi_aim_phy.hpp \
              hackrf/source_expanded/firmware/common/wifi_aim/wifi_aim_phy.cpp \
              hackrf/source_expanded/firmware/baseband/proc_wifi_aim.hpp \
              hackrf/source_expanded/firmware/baseband/proc_wifi_aim.cpp
          git commit -m 'Fix8m: measure SERVICE distance on DATA candidates'
          git push origin HEAD:wifi-aim-fix8m-service-distance
