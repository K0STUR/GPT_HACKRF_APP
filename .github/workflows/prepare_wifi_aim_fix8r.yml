name: Prepare WiFi AIM Fix8r hybrid LTF timing refine

on:
  pull_request:
    paths:
      - 'hackrf/FIX8R_PREP_TRIGGER.txt'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply Fix8r
        run: python3 hackrf/tools/apply_fix8r_hybrid_ltf_refine.py

      - name: Validate Fix8r markers
        shell: bash
        run: |
          set -euo pipefail
          grep -q "Fix8r: keep Fix8c's channel-invariant repetition detector" hackrf/source_expanded/firmware/common/wifi_aim/wifi_aim_phy.cpp
          grep -q 'const std::size_t local_lo = nominal_d > 16u ? nominal_d - 16u : 0u;' hackrf/source_expanded/firmware/common/wifi_aim/wifi_aim_phy.cpp
          grep -q 'score = std::min(1.0f, ref_best);' hackrf/source_expanded/firmware/common/wifi_aim/wifi_aim_phy.cpp

      - name: Commit Fix8r source only
        shell: bash
        run: |
          set -euo pipefail
          rm -f hackrf/FIX8R_PREP_TRIGGER.txt
          rm -f hackrf/tools/apply_fix8r_hybrid_ltf_refine.py
          rm -f .github/workflows/prepare_wifi_aim_fix8r.yml
          git config user.name K0STUR
          git config user.email 74721566+K0STUR@users.noreply.github.com
          git add -A
          git commit -m 'WiFi AIM Fix8r: hybrid repetition plus local LTF timing refine'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
