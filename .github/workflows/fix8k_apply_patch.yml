name: Fix8k one-shot source patch

on:
  push:
    branches:
      - wifi-aim-fix8k-viterbi-erasure

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wifi-aim-fix8k-viterbi-erasure
          fetch-depth: 0

      - name: Apply Fix8k erasure preservation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('hackrf/source_expanded/firmware/common/wifi_aim/wifi_aim_phy.cpp')
          s = p.read_text()
          old = '        const uint8_t r0=coded[2*t]&1u, r1=coded[2*t+1]&1u;'
          new = '        const uint8_t r0=coded[2*t], r1=coded[2*t+1];'
          if new in s and old not in s:
              print('Fix8k already applied')
              raise SystemExit(0)
          if s.count(old) != 1:
              raise SystemExit(f'Expected exactly one Viterbi erasure line, found {s.count(old)}')
          s = s.replace(old, new, 1)
          p.write_text(s)
          print('Applied Fix8k: preserve depuncture erasure value 2 into Viterbi')
          PY

      - name: Commit Fix8k source change
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- hackrf/source_expanded/firmware/common/wifi_aim/wifi_aim_phy.cpp; then
            echo 'No source change to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hackrf/source_expanded/firmware/common/wifi_aim/wifi_aim_phy.cpp
          git commit -m 'Fix8k: preserve puncturing erasures in Viterbi'
          git push origin HEAD:wifi-aim-fix8k-viterbi-erasure
