name: Fix8l one-shot DATA-candidate telemetry patch

on:
  push:
    branches:
      - wifi-aim-fix8l-data-rate-diag

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wifi-aim-fix8l-data-rate-diag
          fetch-depth: 0

      - name: Apply Fix8l DATA-candidate telemetry
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('hackrf/source_expanded/firmware/baseband/proc_wifi_aim.cpp')
          s = p.read_text()
          old = '''    if (ofdm_trace.rate_raw != 0xFFu) ofdm_last_rate_ = ofdm_trace.rate_raw;\n    if (ofdm_trace.length) ofdm_last_length_ = ofdm_trace.length;'''
          new = '''    // Fix8l: A/N telemetry must describe the candidate that actually reached\n    // DATA Viterbi. Later parity-only/noisy captures used to overwrite these\n    // fields and made hardware results impossible to classify by PHY rate.\n    if (ofdm_trace.stage >= 7u) {\n        if (ofdm_trace.rate_raw != 0xFFu) ofdm_last_rate_ = ofdm_trace.rate_raw;\n        if (ofdm_trace.length) ofdm_last_length_ = ofdm_trace.length;\n    }'''
          if new in s and old not in s:
              print('Fix8l already applied')
              raise SystemExit(0)
          if s.count(old) != 1:
              raise SystemExit(f'Expected one A/N telemetry block, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          print('Applied Fix8l DATA-candidate telemetry')
          PY

      - name: Commit Fix8l source change
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- hackrf/source_expanded/firmware/baseband/proc_wifi_aim.cpp; then
            echo 'No source change to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hackrf/source_expanded/firmware/baseband/proc_wifi_aim.cpp
          git commit -m 'Fix8l: pin telemetry to DATA Viterbi candidates'
          git push origin HEAD:wifi-aim-fix8l-data-rate-diag
