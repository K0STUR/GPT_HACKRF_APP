name: Patch WiFi AIM known veneers n_260808

on:
  push:
    paths:
      - '.github/workflows/patch_wifi_aim_known_veneers_n260808.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch only core veneers whose exact stock target is proven by working probe
        shell: bash
        run: |
          set -euo pipefail
          OUT=build_results/wifi_aim_test_veneerpatch1_n260808
          rm -rf "$OUT"; mkdir -p "$OUT"
          python3 - <<'PY'
          from pathlib import Path
          import struct,hashlib,base64

          probe=Path('build_results/wifi_aim_probe_n260808/WiFiAimProbe_n260808.ppma').read_bytes()
          src=bytearray(Path('build_results/wifi_aim_full_n260808_fix3/WiFiAIM_n260808_fix3.ppma').read_bytes())
          prefix=bytes.fromhex('01b40248844601bc604700bf')

          def veneers(b):
              vals=[]; i=0
              while True:
                  i=b.find(prefix,i)
                  if i<0: break
                  if i+16<=len(b): vals.append((i,struct.unpack_from('<I',b,i+12)[0]))
                  i+=1
              return vals

          probe_targets={v for _,v in veneers(probe)}
          before=veneers(src)
          patched=[]
          # Exact evidence rule only: if current target-0x14 is present as a real veneer
          # in the working n_260808 probe, use that proven stock target.
          for off,v in before:
              cand=(v-0x14)&0xffffffff
              if cand in probe_targets:
                  struct.pack_into('<I',src,off+12,cand)
                  patched.append((off,v,cand))

          # Replace final checksum word so 32-bit sum is zero.
          assert len(src)%4==0
          src[-4:]=b'\0\0\0\0'
          total=sum(struct.unpack_from('<I',src,i)[0] for i in range(0,len(src),4))&0xffffffff
          struct.pack_into('<I',src,len(src)-4,(-total)&0xffffffff)
          chk=sum(struct.unpack_from('<I',src,i)[0] for i in range(0,len(src),4))&0xffffffff
          assert chk==0

          after=veneers(src)
          assert any(v==0x0007EE25 for _,v in after), 'operator new stock veneer not repaired'
          assert not any(v==0x0007EE39 for _,v in after), 'shifted operator new remains'

          out=Path('build_results/wifi_aim_test_veneerpatch1_n260808/WiFiAIM_n260808_TEST_veneerpatch1.ppma')
          out.write_bytes(src)
          sha=hashlib.sha256(src).hexdigest()
          lines=[
              f'size={len(src)}',
              f'patched_count={len(patched)}',
              f'loader_word_sum=0x{chk:08X}',
              f'sha256={sha}',
              'operator_new=0x0007EE25',
              'RESULT=PASS',
              '',
              'PATCHED VENEERS:'
          ]
          lines += [f'off=0x{o:04X} {old:08X}->{new:08X}' for o,old,new in patched]
          Path('build_results/wifi_aim_test_veneerpatch1_n260808/VERIFY.txt').write_text('\n'.join(lines)+'\n')
          Path('build_results/wifi_aim_test_veneerpatch1_n260808/SHA256SUMS.txt').write_text(f'{sha}  {out}\n')
          Path(str(out)+'.b64').write_text(base64.b64encode(src).decode())
          PY
          cat "$OUT/VERIFY.txt"
          git config user.name 'wifi-aim-builder'
          git config user.email 'actions@users.noreply.github.com'
          git add -f "$OUT"
          git commit -m 'Publish diagnostic WiFi AIM veneerpatch1 n_260808' || true
          git pull --rebase origin main || true
          git push origin HEAD:main
