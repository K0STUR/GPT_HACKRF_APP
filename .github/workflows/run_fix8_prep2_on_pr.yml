name: Run WiFi AIM Fix8 preparer v2

on:
  pull_request:
    paths:
      - 'hackrf/FIX8_PR_TRIGGER2.txt'
      - '.github/workflows/run_fix8_prep2_on_pr.yml'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Extract and adapt Fix8 patcher for Fix7c
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          y = Path('.github/workflows/prepare_wifi_aim_fix8.yml').read_text().splitlines()
          start = end = None
          for i, line in enumerate(y):
              if "python3 - <<'PY'" in line:
                  start = i + 1
                  continue
              if start is not None and line.strip() == 'PY':
                  end = i
                  break
          assert start is not None and end is not None
          patch = '\n'.join(line[10:] if line.startswith('          ') else line for line in y[start:end]) + '\n'

          old_decl = "'    void update_scan_status();\\n    uint16_t scan_capture_delta() const;'"
          new_decl = "'    void update_scan_status();\\n    void update_done_status();\\n    uint16_t scan_capture_delta() const;'"
          old_repl = "'    void update_scan_status();\\n    void update_phy_diag_display();\\n    uint8_t stage_delta(std::size_t i) const;\\n    uint16_t scan_capture_delta() const;'"
          new_repl = "'    void update_scan_status();\\n    void update_done_status();\\n    void update_phy_diag_display();\\n    uint8_t stage_delta(std::size_t i) const;\\n    uint16_t scan_capture_delta() const;'"
          assert old_decl in patch and old_repl in patch
          patch = patch.replace(old_decl, new_decl, 1).replace(old_repl, new_repl, 1)

          # Remove the Fix7b-specific end_scan replacement. Fix7c already has
          # update_done_status(), which we patch explicitly below.
          marker = 'rep(uic,\n              \'\'\'    text_status.set("Done "'
          a = patch.find(marker)
          assert a >= 0
          b = patch.find('\nrep(uic,', a + len(marker))
          assert b > a
          patch = patch[:a] + patch[b+1:]

          old_done = '''void WifiAimView::update_done_status() {
    if (scanning_ || target_set_) return;
    text_status.set("Done " + to_string_dec_uint(ap_count_) + "AP C" +
                    to_string_dec_uint(scan_capture_delta()) + " D" +
                    to_string_dec_uint(scan_decode_delta()));
}'''
          new_done = '''void WifiAimView::update_done_status() {
    if (scanning_ || target_set_) return;
    text_status.set("Done " + to_string_dec_uint(ap_count_) + "AP C" +
                    to_string_dec_uint(scan_capture_delta()) + " D" +
                    to_string_dec_uint(scan_decode_delta()) + " M" +
                    to_string_dec_uint(diag_ack_channel_));
    update_phy_diag_display();
}'''
          insert = '\nrep(uic, ' + repr(old_done) + ', ' + repr(new_done) + ')\n'
          anchor = "# Build-time sanity markers."
          pos = patch.find(anchor)
          assert pos >= 0
          patch = patch[:pos] + insert + patch[pos:]

          Path('/tmp/fix8_patch.py').write_text(patch)
          PY
          python3 -m py_compile /tmp/fix8_patch.py
          python3 /tmp/fix8_patch.py

      - name: Validate prepared sources
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'M4DecodeTrace' hackrf/source_expanded/firmware/common/wifi_aim/wifi_aim_phy.hpp
          grep -q 'ofdm_ltf_total' hackrf/source_expanded/firmware/common/wifi_aim_wire.hpp
          grep -q 'OF L/S/D/M' hackrf/source_expanded/firmware/application/external/wifi_aim/ui_wifi_aim.cpp
          grep -q 'DS B/F/P/M' hackrf/source_expanded/firmware/application/external/wifi_aim/ui_wifi_aim.cpp
          grep -q 'update_done_status' hackrf/source_expanded/firmware/application/external/wifi_aim/ui_wifi_aim.hpp

      - name: Commit prepared Fix8 sources to PR branch
        shell: bash
        run: |
          set -euo pipefail
          rm -f hackrf/FIX8_PR_TRIGGER.txt hackrf/FIX8_PR_TRIGGER2.txt hackrf/FIX8_PREP_TRIGGER.txt
          rm -f .github/workflows/prepare_wifi_aim_fix8.yml .github/workflows/run_fix8_prep_on_pr.yml .github/workflows/run_fix8_prep2_on_pr.yml
          git config user.name K0STUR
          git config user.email 74721566+K0STUR@users.noreply.github.com
          git add -A
          git commit -m 'WiFi AIM Fix8: add OFDM DSSS stage telemetry'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
