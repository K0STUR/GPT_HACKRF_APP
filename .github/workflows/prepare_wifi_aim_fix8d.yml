name: Prepare WiFi AIM Fix8d full legacy OFDM

on:
  pull_request:
    paths:
      - 'hackrf/FIX8D_PREP_TRIGGER.txt'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply Fix8d full legacy OFDM
        run: python3 hackrf/tools/apply_fix8d_full_legacy_ofdm.py

      - name: Run Fix8d FEC reference tests
        run: python3 hackrf/tools/test_fix8d_fec_reference.py

      - name: Validate Fix8d markers
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'kMaxCbps = 288' hackrf/source_expanded/firmware/common/wifi_aim/wifi_aim_phy.hpp
          grep -q 'case 8u:.*rate_mbps=48' hackrf/source_expanded/firmware/common/wifi_aim/wifi_aim_phy.cpp
          grep -q 'case 12u:.*rate_mbps=54' hackrf/source_expanded/firmware/common/wifi_aim/wifi_aim_phy.cpp
          grep -q 'erasure: Viterbi assigns zero branch penalty' hackrf/source_expanded/firmware/common/wifi_aim/wifi_aim_phy.cpp

      - name: Commit Fix8d sources
        shell: bash
        run: |
          set -euo pipefail
          rm -f hackrf/FIX8D_PREP_TRIGGER.txt
          git config user.name K0STUR
          git config user.email 74721566+K0STUR@users.noreply.github.com
          git add -A
          git commit -m 'WiFi AIM Fix8d: full legacy OFDM rates'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
