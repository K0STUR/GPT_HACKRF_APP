name: Fix8n one-shot SERVICE seed recovery patch

on:
  push:
    branches:
      - wifi-aim-fix8n-service-seed-recovery

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wifi-aim-fix8n-service-seed-recovery
          fetch-depth: 0

      - name: Apply Fix8n SERVICE seed recovery
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('hackrf/source_expanded/firmware/common/wifi_aim/wifi_aim_phy.cpp')
          s = p.read_text()
          if 'Fix8n: recover the scrambler state' in s:
              print('Fix8n already applied')
              raise SystemExit(0)

          old = '''    unsigned state=0;\n    for (unsigned i=0;i<7;++i) if (decoded_[i]) state|=1u<<(6-i);\n    bytes_.fill(0);\n    bytes_[0]=static_cast<uint8_t>(state);\n    const std::size_t max_out_bits=std::min<std::size_t>(data_dec,bytes_.size()*8u);\n    uint8_t service_errors = 0u;\n    for (std::size_t i=7;i<max_out_bits;++i) {\n        const unsigned feedback=((state&64u)?1u:0u)^((state&8u)?1u:0u);\n        const unsigned bit=feedback^(decoded_[i]&1u);\n        if (i < 16u && bit) ++service_errors;\n        bytes_[i/8u]|=static_cast<uint8_t>(bit<<(i%8u));\n        state=((state<<1)&0x7e)|feedback;\n    }\n    if (trace) trace->service_errors = service_errors;\n    if (service_errors != 0u) return false;'''

          new = '''    // Fix8n: recover the scrambler state from all 16 known-zero SERVICE bits.\n    // Trusting decoded_[0..6] directly is fragile: one Viterbi error there makes\n    // the derived LFSR state wrong and turns the remaining SERVICE check random.\n    uint8_t best_state = 0u;\n    uint8_t service_errors = 0xFFu;\n    for (unsigned candidate=1u; candidate<128u; ++candidate) {\n        unsigned st=candidate;\n        uint8_t errors=0u;\n        for (unsigned i=0;i<7u;++i) {\n            const unsigned expected=(candidate>>(6u-i))&1u;\n            errors += static_cast<uint8_t>((decoded_[i]&1u) != expected);\n        }\n        for (unsigned i=7u;i<16u;++i) {\n            const unsigned feedback=((st&64u)?1u:0u)^((st&8u)?1u:0u);\n            errors += static_cast<uint8_t>((decoded_[i]&1u) != feedback);\n            st=((st<<1)&0x7eu)|feedback;\n        }\n        if (errors < service_errors) {\n            service_errors=errors;\n            best_state=static_cast<uint8_t>(candidate);\n        }\n    }\n    if (trace) trace->service_errors = service_errors;\n    // Radius 1 repairs one hard-decision/Viterbi error while keeping the\n    // SERVICE gate selective. Wider correction is deliberately not allowed.\n    if (best_state == 0u || service_errors > 1u) return false;\n\n    unsigned state=best_state;\n    // SERVICE plaintext bits 0..15 are known zeros. Advance the recovered\n    // scrambler state through bits 7..15 without propagating received errors.\n    for (unsigned i=7u;i<16u;++i) {\n        const unsigned feedback=((state&64u)?1u:0u)^((state&8u)?1u:0u);\n        state=((state<<1)&0x7eu)|feedback;\n    }\n    bytes_.fill(0);\n    const std::size_t max_out_bits=std::min<std::size_t>(data_dec,bytes_.size()*8u);\n    for (std::size_t i=16u;i<max_out_bits;++i) {\n        const unsigned feedback=((state&64u)?1u:0u)^((state&8u)?1u:0u);\n        const unsigned bit=feedback^(decoded_[i]&1u);\n        bytes_[i/8u]|=static_cast<uint8_t>(bit<<(i%8u));\n        state=((state<<1)&0x7eu)|feedback;\n    }'''

          n = s.count(old)
          if n != 1:
              raise SystemExit(f'Fix8n anchor count={n}')
          p.write_text(s.replace(old,new,1))
          print('Applied Fix8n SERVICE seed recovery')
          PY

      - name: Commit Fix8n source change
        shell: bash
        run: |
          set -euo pipefail
          TARGET=hackrf/source_expanded/firmware/common/wifi_aim/wifi_aim_phy.cpp
          if git diff --quiet -- "$TARGET"; then
            echo 'No source change to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$TARGET"
          git commit -m 'Fix8n: recover SERVICE scrambler seed with radius-1 correction'
          git push origin HEAD:wifi-aim-fix8n-service-seed-recovery
