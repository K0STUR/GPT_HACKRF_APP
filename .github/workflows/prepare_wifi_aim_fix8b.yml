name: Prepare WiFi AIM Fix8b stage diagnostics

on:
  pull_request:
    paths:
      - 'hackrf/FIX8B_PREP_TRIGGER.txt'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply Fix8b stage diagnostics
        run: python3 hackrf/tools/apply_fix8b_stage_diag.py

      - name: Validate source markers
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'M4OfdmTrace' hackrf/source_expanded/firmware/common/wifi_aim/wifi_aim_phy.hpp
          grep -q 'OF L/H/V/P' hackrf/source_expanded/firmware/application/external/wifi_aim/ui_wifi_aim.cpp
          grep -q 'OF R/N/D/M' hackrf/source_expanded/firmware/application/external/wifi_aim/ui_wifi_aim.cpp
          grep -q 'ssid_len = 0xF9u' hackrf/source_expanded/firmware/baseband/proc_wifi_aim.cpp

      - name: Commit prepared Fix8b sources
        shell: bash
        run: |
          set -euo pipefail
          rm -f hackrf/FIX8B_PREP_TRIGGER.txt
          git config user.name K0STUR
          git config user.email 74721566+K0STUR@users.noreply.github.com
          git add -A
          git commit -m 'WiFi AIM Fix8b: instrument OFDM decode stages'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
